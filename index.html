<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Show Ops">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>Show Ops</title>
<!-- build: 2026-10-08 r9 (Radar: cross-source checks, run of show, agenda, tasks) -->
<style>
  :root {
    --bg: #0b0d0f;
    --panel: #111417;
    --panel2: #171b1f;
    --line: #22272d;
    --line2: #2e343b;
    --text: #e7ebf0;
    --dim: #8b95a1;
    --faint: #5f6873;
    --accent: #6aaeff;
    --green: #3fcf7c;
    --amber: #e3a83a;
    --red: #ff6257;
    --sel: #16202d;
    --accent-t: rgba(106,174,255,.14);
    --green-t: rgba(63,207,124,.14);
    --amber-t: rgba(227,168,58,.14);
    --red-t: rgba(255,98,87,.14);
    --dim-t: rgba(139,149,161,.13);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; color-scheme: dark; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--sans);
    font-size: 13px; line-height: 1.42; height: 100dvh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  [hidden] { display: none !important; }
  .mono { font-variant-numeric: tabular-nums; }
  .dimtxt { color: var(--dim); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
  .tap { padding: 12px; margin: -12px; display: inline-block; }
  button { font-family: inherit; color: inherit; }
  .ic { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2.5px; flex: none; }

  /* ── PIN gate ── */
  #pinGate {
    position: fixed; inset: 0; background: var(--bg); z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px;
  }
  #pinGate h1 { font-size: 13px; font-weight: 700; letter-spacing: .18em; }
  #pinInput {
    background: var(--panel); border: 1px solid var(--line2); border-radius: 8px;
    color: var(--text); font-size: 22px; letter-spacing: 10px; text-align: center;
    padding: 10px 8px; width: 200px; outline: none;
  }
  #pinInput:focus { border-color: var(--accent); }
  #pinBtn {
    background: var(--accent); color: #04101f; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; padding: 12px 36px; cursor: pointer; min-height: 44px;
  }
  #pinErr { color: var(--red); font-size: 13px; min-height: 18px; }

  /* ── App frame ── */
  #app { display: none; height: 100dvh; flex-direction: column; }
  #topbar {
    display: flex; align-items: center; gap: 14px;
    padding: env(safe-area-inset-top) 14px 0; min-height: calc(44px + env(safe-area-inset-top)); flex: none;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #topbar h1 { font-size: 12px; font-weight: 700; letter-spacing: .18em; white-space: nowrap; }
  #topStats { display: flex; gap: 16px; color: var(--dim); font-size: 12px; flex: 1; overflow: hidden; white-space: nowrap; }
  #topStats b { color: var(--text); font-weight: 600; }
  #topStats .hot, #topStats .hot b { color: var(--red); }
  #updated { color: var(--faint); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #updated.stale { color: var(--amber); }
  #refreshBtn {
    background: none; border: 1px solid var(--line2); color: var(--dim); border-radius: 8px;
    min-width: 44px; min-height: 32px; font-size: 15px; cursor: pointer;
  }
  #refreshBtn:hover { color: var(--text); border-color: var(--dim); }

  #main { display: flex; flex: 1; min-height: 0; }

  /* ── List (left) ── */
  #list {
    width: 340px; flex: none; overflow-y: auto;
    border-right: 1px solid var(--line); background: var(--panel);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .rrow { display: flex; gap: 11px; align-items: center; padding: 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .rrow:hover { background: var(--panel2); }
  .rrow.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  .rrow .ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-t); color: var(--accent); flex: none; }
  .rrow .ico .ic { width: 17px; height: 17px; vertical-align: 0; }
  .rrow .rb { min-width: 0; flex: 1; }
  .rrow .t { font-size: 13px; font-weight: 700; }
  .rrow .m { color: var(--dim); font-size: 11.5px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rrow .cn { display: flex; gap: 5px; flex: none; }
  .rrow .cn .tag { font-size: 11px; padding: 2px 7px; min-width: 22px; text-align: center; }

  .lrow { padding: 10px 12px 9px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .lrow:hover { background: var(--panel2); }
  .lrow.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  .lrow .t { font-size: 13px; font-weight: 600; display: flex; gap: 7px; align-items: center; }
  .lrow .t .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .t .bn { color: var(--faint); font-weight: 400; font-size: 11.5px; flex: none; font-variant-numeric: tabular-nums; }
  .lrow .m { display: flex; gap: 8px; color: var(--dim); font-size: 11.5px; margin-top: 3px; align-items: center; white-space: nowrap; }
  .lrow .m .cty { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .lrow .m .shp { color: var(--amber); display: inline-flex; gap: 3px; align-items: center; flex: none; }
  .lrow .m .shp .ic { width: 12px; height: 12px; vertical-align: 0; }
  .sp { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .sp.s3 { background: var(--red); box-shadow: 0 0 0 3px var(--red-t); }
  .sp.s2 { background: var(--amber); }
  .tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; letter-spacing: .05em; flex: none; white-space: nowrap; }
  .tag.travel { color: #a9d0ff; background: var(--accent-t); }
  .tag.remote { color: var(--dim); background: var(--dim-t); }
  .tag.live   { color: var(--green); background: var(--green-t); }
  .tag.urgent { color: var(--amber); background: var(--amber-t); }
  .tag.danger { color: var(--red); background: var(--red-t); }
  .tag.done   { color: var(--dim); background: var(--dim-t); }
  .tag.you    { color: var(--text); background: var(--dim-t); margin-left: 6px; }
  .lrow .cnt { margin-left: auto; display: flex; gap: 9px; align-items: center; flex: none; }
  .lrow .cnt span { display: inline-flex; gap: 3px; align-items: center; }
  .lrow .cnt .ic { width: 12px; height: 12px; vertical-align: 0; }
  .newdot { color: var(--amber); font-weight: 700; }
  .lsec { padding: 7px 12px 5px; color: var(--faint); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; background: var(--bg); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }

  /* ── Archive ── */
  .arch-btn {
    background: none; border: none; color: var(--dim); cursor: pointer;
    font-size: 11px; padding: 4px 6px; margin: -4px -6px -4px 0; border-radius: 4px;
    opacity: 0; transition: opacity .15s, color .15s; flex: none;
  }
  .lrow:hover .arch-btn, .lrow:focus-within .arch-btn { opacity: 1; }
  .arch-btn:hover { color: var(--red); }
  .restore-btn {
    background: none; border: 1px solid var(--line2); color: var(--dim); cursor: pointer;
    font-size: 10px; padding: 2px 8px; border-radius: 4px; flex: none;
    transition: color .15s, border-color .15s;
  }
  .restore-btn:hover { color: var(--green); border-color: var(--green); }
  .arch-sec .lrow { opacity: 0.55; }
  .arch-sec .lrow:hover { opacity: 0.85; }
  .arch-toggle { cursor: pointer; user-select: none; }
  .chev { font-size: 9px; margin-left: 4px; display: inline-block; transition: transform .15s; }
  .collapsed .chev { transform: rotate(-90deg); }

  /* ── Detail (right) ── */
  #detail { flex: 1; overflow-y: auto; min-width: 0; }
  #detail .inner { padding: 16px 20px calc(60px + env(safe-area-inset-bottom)); max-width: 1400px; }
  #backBtn { display: none; background: none; border: none; color: var(--accent); font-size: 15px; padding: 12px 14px 2px; cursor: pointer; }

  .dhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 5px; }
  .dhead h2 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .dsub { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; color: var(--dim); font-size: 12.5px; margin-bottom: 14px; }

  .datebar { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; margin-bottom: 12px; background: var(--panel); }
  .datebar .d { flex: 1; min-width: 86px; padding: 8px 11px; border-right: 1px solid var(--line); }
  .datebar .d:last-child { border-right: none; }
  .datebar .k { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .datebar .v { font-size: 13.5px; font-weight: 600; margin-top: 2px; white-space: nowrap; }
  .datebar .d.today { background: var(--amber-t); }
  .datebar .d.today .v { color: var(--amber); }
  .datebar .d.ship:not(.past) { background: rgba(227,168,58,.08); }
  .datebar .d.ship:not(.past) .v, .datebar .d.ship:not(.past) .k { color: var(--amber); }
  .datebar .d.past .v { color: var(--faint); font-weight: 400; }

  #wx { display: flex; gap: 6px; overflow-x: auto; margin: -4px 0 12px; }
  #wx .w { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font-size: 12px; white-space: nowrap; color: var(--dim); }
  #wx .w b { color: var(--text); font-weight: 600; }

  .cols { display: grid; grid-template-columns: 1fr 1.15fr; gap: 14px; margin-bottom: 14px; }
  @media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
  .box { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-width: 0; overflow: hidden; }
  .box.gap { margin-bottom: 14px; }
  .box h3 {
    font-size: 10.5px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .1em;
    padding: 9px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; min-height: 36px;
  }
  .box h3 .r { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; display: flex; gap: 10px; align-items: center; }
  .box h3.tgl { cursor: pointer; user-select: none; }
  .box h3.last, .box h3.collapsed { border-bottom: none; }
  .box .pad { padding: 10px 12px; }
  .box h3 button { background: none; border: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 6px; margin: -6px; display: inline-flex; gap: 5px; align-items: center; }

  .linkbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .linkbar a, .linkbar button {
    border: 1px solid var(--line2); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 8px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer; min-height: 36px;
    display: inline-flex; gap: 6px; align-items: center;
  }
  .linkbar a:hover, .linkbar button:hover { border-color: var(--accent); color: var(--accent); }
  .linkbar .arr { color: var(--faint); font-weight: 400; }

  /* ── Crew ── */
  .cr { display: grid; grid-template-columns: minmax(0,1fr) auto; grid-template-areas: "n s" "d a" "x x"; gap: 3px 14px; padding: 9px 12px; border-bottom: 1px solid var(--line); align-items: baseline; }
  .cr:last-child { border-bottom: none; }
  .cr .n { grid-area: n; font-weight: 600; min-width: 0; }
  .cr .role { color: var(--dim); font-weight: 400; font-size: 11.5px; margin-left: 7px; }
  .cr .dts { grid-area: d; color: var(--dim); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cr .st { grid-area: s; font-size: 12px; white-space: nowrap; text-align: right; }
  .cr .act { grid-area: a; display: flex; gap: 14px; justify-content: flex-end; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cr .x { grid-area: x; color: var(--dim); font-size: 11.5px; }
  .cr .x:empty { display: none; }
  .stat-ok { color: var(--green); } .stat-pencil { color: var(--amber); } .stat-other { color: var(--dim); }

  /* ── Emails ── */
  .mail { border-bottom: 1px solid var(--line); }
  .mail:last-child { border-bottom: none; }
  .mail > .hd { display: flex; gap: 10px; padding: 10px 12px; cursor: pointer; align-items: baseline; }
  .mail > .hd:hover { background: var(--panel2); }
  .mail .from { font-weight: 600; white-space: nowrap; flex: none; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .mail .sub { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  .mail.open .sub { white-space: normal; color: var(--text); }
  .mail .dt { color: var(--faint); font-size: 11.5px; white-space: nowrap; flex: none; }
  .mail .body {
    display: none; padding: 4px 12px 12px; color: #c6cdd5; font-size: 12.5px;
    white-space: pre-wrap; word-break: break-word; border-top: 1px dashed var(--line);
    max-height: 420px; overflow-y: auto;
  }
  .mail.open .body { display: block; }
  .mail .to { color: var(--dim); font-size: 11px; padding: 4px 12px 0; display: none; }
  .mail.open .to { display: block; }
  .mailfoot { padding: 10px 12px; font-size: 12px; display: flex; gap: 16px; border-top: 1px solid var(--line); }

  /* ── Meeting notes ── */
  .mtg { border-bottom: 1px solid var(--line); }
  .mtg:last-child { border-bottom: none; }
  .mtg > .hd { display: flex; gap: 10px; padding: 10px 12px; cursor: pointer; align-items: baseline; }
  .mtg > .hd:hover { background: var(--panel2); }
  .mtg .ttl { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mtg.open .ttl { white-space: normal; }
  .mtg .dt { color: var(--faint); font-size: 11.5px; white-space: nowrap; flex: none; }
  .mtg .mtag { font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 3px; letter-spacing: .05em; flex: none; }
  .mtag.spec { color: var(--green); background: var(--green-t); }
  .mtag.ment { color: var(--dim); background: var(--dim-t); }
  .flagdot { color: var(--amber); flex: none; }
  .mtg .body { display: none; padding: 2px 12px 12px; }
  .mtg.open .body { display: block; }
  .mtg .rel { color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin-bottom: 5px; }
  .mtg .sum { color: #c6cdd5; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
  .mtg .ai { margin: 9px 0 0; padding: 8px 10px; background: var(--panel2); border-radius: 6px; }
  .mtg .ai .h { font-size: 10.5px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .mtg .ai ul { margin: 0; padding-left: 16px; }
  .mtg .ai li { font-size: 12.5px; margin: 2px 0; }
  .mtg .dflag { margin-top: 9px; padding: 7px 10px; border-radius: 6px; font-size: 12px; background: var(--amber-t); color: var(--amber); border: 1px solid rgba(227,168,58,.3); }

  #notesView { white-space: pre-wrap; }
  #notesEdit { display: none; padding: 8px 12px; }
  #notesEdit textarea {
    width: 100%; min-height: 120px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line2); border-radius: 6px; padding: 8px; font: inherit; resize: vertical;
  }
  #notesEdit .row2 { display: flex; gap: 8px; margin-top: 8px; }
  #notesEdit button { border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; min-height: 38px; }
  #notesSave { background: var(--accent); color: #04101f; border: none; font-weight: 700; }
  #notesCancel { background: none; color: var(--dim); border: 1px solid var(--line2); }
  #notesMsg { color: var(--green); font-size: 12px; align-self: center; }

  /* ── Radar: catches ── */
  .rc { display: grid; grid-template-columns: 8px minmax(0,1fr) auto; gap: 0 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .rc[data-go] { cursor: pointer; }
  .rc[data-go]:hover { background: var(--panel2); }
  .rc:last-child { border-bottom: none; }
  .rc .pip { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; }
  .rc.s3 .pip { background: var(--red); box-shadow: 0 0 0 3px var(--red-t); }
  .rc.s2 .pip { background: var(--amber); }
  .rc.s1 .pip { border: 1.5px solid var(--faint); }
  .rc .kx { font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); margin-bottom: 1px; }
  .rc .kx b { color: var(--dim); font-weight: 700; }
  .rc .tt { font-size: 13px; font-weight: 600; }
  .rc .dd { color: var(--dim); font-size: 12.5px; margin-top: 1px; }
  .rc .ss { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-top: 4px; overflow-wrap: anywhere; }
  .rc .rt { display: flex; gap: 6px; align-items: flex-start; }
  .rc .due { font-size: 11.5px; color: var(--dim); white-space: nowrap; padding-top: 5px; font-variant-numeric: tabular-nums; }
  .rc.s3 .due { color: var(--red); }
  .rc .ack { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line2); background: none; color: var(--faint); cursor: pointer; display: grid; place-items: center; }
  .rc .ack:hover { color: var(--green); border-color: var(--green); }
  .rc .ack .ic { vertical-align: 0; }
  .rc.acked { opacity: .55; }
  .rc.acked .ack { color: var(--green); border-color: rgba(63,207,124,.4); }
  .rsec { padding: 7px 12px 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); background: var(--bg); border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  .rsec.s3 { color: var(--red); } .rsec.s2 { color: var(--amber); }
  .rsec span { color: var(--faint); font-weight: 600; }
  details.ackd { border-top: 1px solid var(--line); }
  details.ackd summary { padding: 9px 12px; font-size: 11.5px; color: var(--dim); cursor: pointer; list-style: none; user-select: none; }
  details.ackd summary::-webkit-details-marker { display: none; }
  details.ackd summary::before { content: "▸ "; color: var(--faint); }
  details.ackd[open] summary::before { content: "▾ "; }
  details.ackd[open] summary { border-bottom: 1px solid var(--line); }
  .rfoot { padding: 9px 12px; font-size: 11px; color: var(--faint); border-top: 1px solid var(--line); line-height: 1.5; }
  .rclear { padding: 22px 12px; text-align: center; color: var(--dim); }
  .rclear b { display: block; color: var(--green); font-size: 13px; margin-bottom: 2px; }
  .rwarn { margin-bottom: 12px; padding: 8px 12px; border-radius: 8px; font-size: 12px; background: var(--amber-t); color: var(--amber); border: 1px solid rgba(227,168,58,.3); }

  /* ── Radar: preflight chips ── */
  .pf { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .pfc { font-size: 11.5px; border: 1px solid var(--line2); border-radius: 999px; padding: 2px 10px; color: var(--dim); white-space: nowrap; }
  .pfc b { font-weight: 600; color: var(--text); margin-left: 5px; }
  .pfc.ok b { color: var(--green); } .pfc.warn b { color: var(--amber); } .pfc.bad b { color: var(--red); }

  /* ── Radar: home ── */
  .rhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 16px; margin-bottom: 14px; }
  .rhead h2 { font-size: 22px; font-weight: 700; letter-spacing: -.015em; }
  .rsum { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .rsum b { color: var(--text); font-weight: 600; } .rsum b.hot { color: var(--red); } .rsum b.warm { color: var(--amber); }
  .rstat { color: var(--faint); font-size: 11px; white-space: nowrap; }
  .rgrid { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(0,1fr); grid-template-areas: "tl tl" "c ag"; gap: 14px; align-items: start; }
  .rgrid .a-tl { grid-area: tl; } .rgrid .a-c { grid-area: c; } .rgrid .a-ag { grid-area: ag; }

// ════════════════════════════════════════════════
// API LAYER
// ════════════════════════════════════════════════
function pin() { return localStorage.getItem("dash_pin") || ""; }

async function api(table, params, method, recordId, body) {
  const qs = new URLSearchParams();
  for (const [k, v] of Object.entries(params || {})) {
    if (Array.isArray(v)) v.forEach(x => qs.append(k, x));
    else qs.append(k, v);
  }
  qs.append("key", pin());
  const base = `${WORKER}/v0/${BASE}/${encodeURIComponent(table)}` + (recordId ? `/${recordId}` : "");
  if (method === "PATCH") {
    const res = await fetch(`${base}?${qs}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (res.status === 401) { const e = new Error("PIN rejected"); e.auth = true; throw e; }
    const data = await res.json();
    if (!res.ok || data.error) throw new Error((data.error && (data.error.message || data.error)) || ("HTTP " + res.status));
    return data;
  }
  let url = `${base}?${qs}`;
  let out = [];
  for (let page = 0; page < 6; page++) {
    const res = await fetch(url);
    if (res.status === 401) { const e = new Error("PIN rejected"); e.auth = true; throw e; }
    if (!res.ok) throw new Error(`Airtable error ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || data.error);
    out = out.concat(data.records || []);
    if (!data.offset) break;
    url = `${base}?${qs}&offset=${data.offset}`;
  }
  return out;
}

// ════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const first = v => Array.isArray(v) ? v[0] : v;

function parseDate(v) {
  v = first(v);
  if (!v) return null;
  if (v instanceof Date) return v;
  let m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3], 12);
  m = String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return new Date(+m[3], +m[1]-1, +m[2], 12);
  const d = new Date(v);
  return isNaN(d) ? null : d;
}
function today0() { const d = new Date(); d.setHours(12,0,0,0); return d; }
function daysFromToday(d) { return Math.round((d - today0()) / 86400000); }
function fmtD(d) { return d ? d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "—"; }
function sameDay(a, b) { return a && b && a.toDateString() === b.toDateString(); }
function fmtRange(a, b) {
  if (!a && !b) return "";
  if (a && b) {
    if (a.getTime() === b.getTime()) return fmtD(a);
    if (a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear())
      return fmtD(a) + "–" + b.getDate();          // Jun 13–21
    return fmtD(a) + " – " + fmtD(b);
  }
  return fmtD(a || b);
}
function agoTxt(d) {
  const n = -daysFromToday(d);
  if (n <= 0) return "today";
  if (n === 1) return "1d ago";
  return n + "d ago";
}
function titleName(s) {
  return String(s || "").split(/\s+/).map(w => w ? w[0].toUpperCase() + w.slice(1) : w).join(" ");
}
function senderName(from) {
  if (!from) return "";
  const f = String(from);
  return titleName(f.includes("@") ? f.split("@")[0].replace(/[._]/g, " ") : f);
}
function fmtPhone(p) {
  let d = String(p).replace(/\D/g, "");
  if (d.length === 11 && d[0] === "1") d = d.slice(1);
  if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  return String(p);
}
function telHref(p) { return "tel:" + String(p).replace(/[^\d+]/g, ""); }
function cleanBody(b) {
  let t = String(b || "");
  t = t.replace(/\[([^\]]*)\]\(([^)]*)\)/g, (m, txt, url) => {
    if (!txt || /^https?:/.test(txt)) return /sophos|wearesparks|facebook|instagram|linkedin|youtube/i.test(url) ? "" : (txt || url);
    return txt;
  });
  t = t.split("\n").filter(line =>
    !/protection\.sophos\.com/.test(line) &&
    !/^<?https?:\/\/(www\.)?(facebook|instagram|youtube|linkedin)\./.test(line.trim()) &&
    !/This email and any attachments are intended only for the person/.test(line)
  ).join("\n");
  t = t.replace(/\*\*([^*]*)\*\*/g, "$1")
       .replace(/\\\*/g, "")
       .replace(/^\s*[#>]{1,6}\s*/gm, "")
       .replace(/\n{3,}/g, "\n\n")
       .trim();
  return t;
}
function extractEmails(s) {
  return [...new Set((String(s || "").match(/[\w.+-]+@[\w.-]+\.\w+/g) || []).map(x => x.toLowerCase()))];
}

// seen-email tracking (new-mail badges)
function seenKey(id) { return "seen_" + id; }
function latestMailTime(s) { return s.mailMeta[0] && s.mailMeta[0].date ? s.mailMeta[0].date.getTime() : 0; }
function newMailCount(s) {
  const seen = +localStorage.getItem(seenKey(s.id));
  if (!seen) { localStorage.setItem(seenKey(s.id), String(latestMailTime(s) || 1)); return 0; }
  return s.mailMeta.filter(m => m.date && m.date.getTime() > seen).length;
}
function markSeen(s) { if (s) localStorage.setItem(seenKey(s.id), String(Math.max(latestMailTime(s), 1))); }

// new-meeting tracking + flag count
function mtgSeenKey(id) { return "mtgseen_" + id; }
function mtgTime(m) { const d = parseDate(m.date); return d ? d.getTime() : 0; }
function latestMtgTime(s) { return (s.meetings || []).reduce((mx, m) => Math.max(mx, mtgTime(m)), 0); }

  file:  '<path d="M2.2 4.2h4l1.4 1.6h6.2v7H2.2z"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">${ICONS[n] || ""}</svg>`;

// ════════════════════════════════════════════════
// NAMING HELPERS
// ════════════════════════════════════════════════
// "JM Vertex @ ASN 2026 #713 Prep + Show" → "Vertex @ ASN"
function shortTitle(t) {
  const s = String(t || "")
    .replace(/\s*#.*$/, "")
    .replace(/\s+20\d\d\b/g, "")
    .replace(/\s*Prep \+ Show\s*$/i, "")
    .replace(/^(?:\(AR\)\s+|Calendar:\s+)?(?:SPX|JM|SS|IXM|IMP|MMS|XL P&O|P&O|Prospect)\s+/, "")
    .trim();
  return s || String(t || "");
}
function boothOf(s) { return s.booth ? "#" + s.booth : ""; }
// "*Jonathan (Johnny) Jordan" → "Johnny J." · "*Iqral La Rode" → "You"
function nick(name) {
  const n = String(name || "").replace(/^\*/, "").trim();
  if (n.includes(ME)) return "You";
  const p = n.match(/\(([^)]+)\)/);
  const parts = n.replace(/\([^)]*\)/g, " ").split(/\s+/).filter(Boolean);
  const firstName = p ? p[1] : (parts[0] || n);
  const last = parts.length > 1 ? parts[parts.length - 1] : "";
  return last ? `${firstName} ${last[0]}.` : firstName;
}
function listNames(arr) {
  const a = arr.map(n => n === "You" ? "you" : n);
  if (a.length <= 1) return a.join("");
  return a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
}
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const dd = (a, b) => Math.round((a - b) / 86400000);
const validQuote = q => !!q && /^\d{4,}$/.test(q);
const fq = s => String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
function dueTxt(d) {
  const n = daysFromToday(d);
  if (n < -1) return (-n) + "d ago";
  if (n === -1) return "yesterday";
  if (n === 0) return "today";
  if (n === 1) return "tomorrow";
  return "in " + n + "d";
}

// ════════════════════════════════════════════════
// DATA LOAD
// ════════════════════════════════════════════════
function applyData(events, positions, mails, fromCache) {
  RAW = { events, positions, mails };
  SHOWS = events.map(e => buildModel(e, positions, mails))
    .sort((a, b) => (a.tlStart || 0) - (b.tlStart || 0));
  if (selectedId !== "radar" && !SHOWS.find(s => s.id === selectedId)) selectedId = "radar";
  computeRadar();
  renderList();
  renderStats();
  renderDetail();
  const up = document.getElementById("updated");
  if (fromCache) { up.textContent = "Cached — refreshing…"; up.classList.add("stale"); }
  else {
    up.textContent = "Live " + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    up.classList.remove("stale");
  }
}

function notesEditing() {
  const e = document.getElementById("notesEdit");
  return !!e && e.style.display === "block";
}

async function loadAll() {
  document.getElementById("errBar").style.display = "none";
  document.getElementById("refreshBtn").innerHTML = '<span class="spin">↻</span>';

  try {
    const events = await api(EVENTS_TBL, {
      view: IQRAL_VIEW,
      filterByFormula: `IS_AFTER({Timeline End},DATEADD(TODAY(),-${WRAPPED_LOOKBACK},'days'))`,
      "fields[]": EVENT_FIELDS
    });

    // Merge pinned shows the view filtered out (see PINNED_EVENTS above)
    const pinMissing = PINNED_EVENTS.filter(id => !events.some(e => e.id === id));
    if (pinMissing.length) {
      const pinFormula = "OR(" + pinMissing.map(id => `RECORD_ID()='${id}'`).join(",") + ")";
      const pinned = await api(EVENTS_TBL, { filterByFormula: pinFormula, "fields[]": EVENT_FIELDS });
      events.push(...pinned);
    }

    // Granola notes (personal layer — KV via worker, never touches Airtable)
    fetch(`${WORKER}/notes?key=${encodeURIComponent(pin())}`)
      .then(r => r.ok ? r.json() : null)
      .then(nd => {
        if (!nd || !nd.shows) return;
        NOTES = nd;
        try { localStorage.setItem("dash_notes", JSON.stringify(nd)); } catch (e) {}
        SHOWS.forEach(s => { s.meetings = nd.shows[s.id] || []; });
        computeRadar();
        renderList(); renderStats();
        if (!notesEditing()) renderDetail();
      })
      .catch(() => {});

    let positions = [], mails = [];
    const ids = events.map(e => e.id);

    const jobs = [];
    if (ids.length) {
      const posFormula = "OR(" + ids.map(id => `FIND('${id}',ARRAYJOIN({id (from Event)}))`).join(",") + ")";
      jobs.push(api(POS_TBL, { filterByFormula: posFormula, "fields[]": POS_FIELDS }).then(r => positions = r));
    }
    // Emails: match on quote number; shows without a real quote number match on the event name instead.
    const mailTerms = events.map(e => {
      const q = e.fields["QuoteNumber(string)"];
      if (validQuote(q)) return `FIND('${q}',ARRAYJOIN({Related Event})&' '&{Subject})`;
      const n = String(e.fields["Name"] || "").trim();
      return n ? `FIND('${fq(n)}',ARRAYJOIN({Related Event}))` : null;
    }).filter(Boolean);
    if (mailTerms.length) {
      jobs.push(api(MAIL_TBL, {
        filterByFormula: "OR(" + mailTerms.join(",") + ")",
        "fields[]": MAIL_META_FIELDS,
        "sort[0][field]": "Received Date",
        "sort[0][direction]": "desc",
        pageSize: 100
      }).then(r => mails = r).catch(() => mails = []));
    }
    await Promise.all(jobs);

    lastLoad = Date.now();
    Object.keys(mailCache).forEach(k => delete mailCache[k]);
    try { localStorage.setItem("dash_cache", JSON.stringify({ t: lastLoad, events, positions, mails })); } catch (e) {}

    applyData(events, positions, mails, false);
    loadRadar(events, positions);   // second pass: cross-source checks; never blocks the page
  } catch (err) {
    if (err.auth) { localStorage.removeItem("dash_pin"); showGate("PIN no longer valid — re-enter."); return; }
    document.getElementById("errTxt").textContent = "Couldn't load data: " + err.message;
    document.getElementById("errBar").style.display = "block";
    const up = document.getElementById("updated");
    if (RAW) { up.textContent = "Offline — showing cached"; up.classList.add("stale"); }
  } finally {
    document.getElementById("refreshBtn").innerHTML = "↻";
  }
}

function buildModel(ev, positions, mails) {
  const f = ev.fields;
  const combined = f["Combined Name"] || f["Name"] || "Untitled";
  const title = combined.split("•")[0].replace(/#\s*$/, "").trim();

  const crew = positions
    .filter(p => {
      const pid = p.fields["id (from Event)"];
      return Array.isArray(pid) ? pid.includes(ev.id) : pid === ev.id;
    })
    .map(p => {
      const pf = p.fields;
      const starts = [].concat(pf["Start (from Timeline Dates)"] || []);
      const ends = [].concat(pf["End (from Timeline Dates)"] || []);
      let stints = starts.map((st, i) => ({ a: parseDate(st), b: parseDate(ends[i]) })).filter(x => x.a || x.b);
      if (!stints.length && (pf["Timeline Start"] || pf["Timeline End"])) {
        stints = [{ a: parseDate(pf["Timeline Start"]), b: parseDate(pf["Timeline End"]) }];
      }
      const raw = first(pf["Name (from Crew)"]) || "";
      const role = first(pf["Short Name (from Roles)"]) || "";
      return {
        raw,
        name: raw.replace(/^\*/, "").trim(),
        email: first(pf["Email (from Crew)"]) || "",
        phone: first(pf["Phone Number (from Crew)"]) || "",
        role,
        staff: role === "Staff",
        status: String(pf["Status"] || "").trim(),
        stints,
        notes: pf["Position Notes"] || "",
        travelInfo: [first(pf["Flight/Hotel Info"]), first(pf["Hotel Info"])].filter(Boolean).join(" · ").trim()
      };
    })
    .filter(c => c.name);

  const quoteStr = f["QuoteNumber(string)"] || "";
  const myMails = mails.filter(m =>
    (m.fields["Related Event"] || []).includes(ev.id) ||
    (validQuote(quoteStr) && String(m.fields["Subject"] || "").includes(quoteStr)));

  return {
    id: ev.id, title,
    quote: validQuote(quoteStr) ? quoteStr : "",
    booth: f["Booth Number"] || ((String(f["Name"] || "").match(/#\s*([A-Za-z0-9][A-Za-z0-9-]*)/) || [])[1] || ""),
    status: f["Status"] || "",
    venue: String(first(f["Venue"]) || "").trim(),
    address: first(f["Venue Address Combined"]) || "",
    city: f["Venue City"] || "",
    cityState: [f["Venue City"], f["Venue State"]].filter(Boolean).join(", "),
    tlStart: parseDate(f["Timeline Start"]),
    tlEnd: parseDate(f["Timeline End"]),
    dates: {
      "Booth Ship": parseDate(f["Booth Ship Date"]),
      "Travel In": parseDate(f["Travel In"]),
      "Load In": parseDate(f["Load In"]),
      "Show Start": parseDate(f["Show Start"]),
      "Show End": parseDate(f["Show End"]),
      "Load Out": parseDate(f["Load Out"]),
      "Travel Out": parseDate(f["Travel Out"])
    },
    links: {
      "Dropbox": f["Dropbox URL"], "Content": f["Dropbox Content URL"],
      "AV Binder": first(f["AV Binder Live Link"]), "InfoDoc": first(f["infoDocs link"])
    },
    am: {
      name: (first(f["Account Manager Name"]) || "").replace(/^\*/, ""),
      phone: first(f["Account Manager Phone"]) || "",
      email: first(f["Account Manager Name Email"]) || ""
    },
    pmNotes: f["PM Notes"] || "",
    clientNotes: f["Client Notes"] || "",
    meetings: (NOTES.shows && NOTES.shows[ev.id]) || [],
    crew,
    travel: crew.some(c => c.name.includes(ME)),
    mailTotal: Math.max((f["Zapier Emails"] || []).length, myMails.length),
    mailMeta: myMails.map(m => ({
      id: m.id,
      from: senderName(m.fields["From"]),
      subj: m.fields["Subject"] || "(no subject)",
      date: parseDate(m.fields["Received Date"])
    }))
  };
}

// ════════════════════════════════════════════════
// STATE HELPERS
// ════════════════════════════════════════════════
// Real deadline = Booth Ship Date when it lands before load-in (or when there's no load-in yet).
// Once the ship date has passed, the deadline reverts to load-in.
function deadlineOf(s) {
  const ship = s.dates["Booth Ship"];
  const loadIn = s.dates["Load In"] || s.tlStart;
  if (ship && ship >= today0() && (!loadIn || ship < loadIn)) return { d: ship, label: "ship", ship: true };
  return { d: loadIn, label: "load-in", ship: false };
}
function stateOf(s) {
  const t = today0();
  if (s.tlEnd && s.tlEnd < t) return "done";
  if (s.tlStart && s.tlStart <= t) return "live";
  const dl = deadlineOf(s).d;
  const d = dl ? daysFromToday(dl) : null;
  if (d !== null && d <= URGENT_DAYS) return "urgent";
  return "upcoming";
}
function countdownTxt(s) {
  const st = stateOf(s);
  if (st === "done") return "wrapped " + agoTxt(s.tlEnd);
  if (st === "live") return "LIVE thru " + fmtD(s.tlEnd);
  const dl = deadlineOf(s);
  if (!dl.d) return "dates TBD";
  const d = daysFromToday(dl.d);
  const verb = dl.ship ? "ships" : "load-in";
  return d === 0 ? verb + " TODAY" : verb + " in " + d + "d";
}
function crewRisk(s) {
  const st = stateOf(s);
  if (st !== "urgent" && st !== "live") return null;
  if (!s.crew.length) return { level: "red", txt: "NO CREW ASSIGNED" };
  const pencilled = s.crew.filter(c => String(c.status).toLowerCase().includes("pencil")).length;
  if (pencilled) return { level: "amber", txt: pencilled + " crew still pencilled" };
  return null;
}

function selectShow(id) {
  selectedId = id;
  renderList(); renderDetail();
  document.getElementById("main").classList.add("show-detail");
  document.getElementById("detail").scrollTop = 0;
}

// ════════════════════════════════════════════════
// RENDER — list + stats
// ════════════════════════════════════════════════
function renderList() {
  const t = today0();
  const allActive = SHOWS.filter(s => !s.tlEnd || s.tlEnd >= t);
  const allWrapped = SHOWS.filter(s => s.tlEnd && s.tlEnd < t).reverse();
  const active = allActive.filter(s => !isArchived(s));
  const wrapped = allWrapped.filter(s => !isArchived(s));
  const archived = SHOWS.filter(s => isArchived(s));

  const open = openCatches();
  const n3 = open.filter(c => c.sev === 3).length, n2 = open.filter(c => c.sev === 2).length;
  const radarLine = (RADAR.loading && !RADAR.t) ? "Running checks…"
    : n3 ? `${n3} need${n3 === 1 ? "s" : ""} action · ${n2} to watch`
    : n2 ? `${n2} to watch` : "Nothing flagged";
  const radarRow = `<div class="rrow ${selectedId === "radar" ? "sel" : ""}" data-id="radar" tabindex="0" role="button">
      <span class="ico">${ic("radar")}</span>
      <div class="rb"><div class="t">Radar</div><div class="m">${radarLine}</div></div>
      <span class="cn">${n3 ? `<span class="tag danger">${n3}</span>` : ""}${n2 ? `<span class="tag urgent">${n2}</span>` : ""}${!n3 && !n2 && RADAR.t ? `<span class="tag live">CLEAR</span>` : ""}</span>
    </div>`;

  const row = s => {
    const st = stateOf(s);
    const risk = crewRisk(s);
    const tag = risk && risk.level === "red" ? '<span class="tag danger">NO CREW</span>'
      : st === "live" ? '<span class="tag live">LIVE</span>'
      : st === "urgent" ? `<span class="tag urgent">${esc(countdownTxt(s).toUpperCase())}</span>`
      : st === "done" ? '<span class="tag done">DONE</span>' : "";
    const dl = deadlineOf(s);
    const shipChip = dl.ship && st !== "done" && st !== "live" && st !== "urgent"
      ? `<span class="shp" title="Booth ships ${fmtD(dl.d)}">${ic("box")}${fmtD(dl.d)}</span>` : "";
    const nNew = s.id === selectedId ? 0 : newMailCount(s);
    const nNewMtg = s.id === selectedId ? 0 : newMtgCount(s);
    const mtgChip = s.meetings && s.meetings.length
      ? `<span title="meeting notes"${nNewMtg ? ' style="color:var(--green);font-weight:700"' : ""}>${ic("note")}${s.meetings.length}</span>` : "";
    const sv = sevOf(s.id);
    const pip = sv.m ? `<span class="sp s${sv.m}" title="${sv.n} open on Radar"></span>` : "";
    return `<div class="lrow ${s.id === selectedId ? "sel" : ""}" data-id="${s.id}" tabindex="0" role="button" title="${esc(s.title)}">
      <div class="t">${pip}<span class="nm">${esc(shortTitle(s.title))}</span>${s.booth ? `<span class="bn">${esc(boothOf(s))}</span>` : ""}${tag}<span class="tag ${s.travel ? "travel" : "remote"}">${s.travel ? "TRAVEL" : "REMOTE"}</span><button class="arch-btn" data-arch="${s.id}" title="Archive show" aria-label="Archive ${esc(s.title)}">✕</button></div>
      <div class="m mono">
        <span>${fmtRange(s.tlStart, s.tlEnd)}</span>
        <span class="cty">${esc(s.city || "")}</span>${shipChip}
        <span class="cnt">${nNew ? `<span class="newdot">● ${nNew} new</span>` : ""}${mtgChip}<span title="emails">${ic("mail")}${s.mailTotal}</span><span title="crew">${ic("crew")}${s.crew.length}</span></span>
      </div>
    </div>`;
  };

  const archRow = s => {
    const st = stateOf(s);
    const tag = st === "done" ? '<span class="tag done">DONE</span>' : "";
    return `<div class="lrow ${s.id === selectedId ? "sel" : ""}" data-id="${s.id}" tabindex="0" role="button" title="${esc(s.title)}">
      <div class="t"><span class="nm">${esc(shortTitle(s.title))}</span>${tag}<span class="tag ${s.travel ? "travel" : "remote"}">${s.travel ? "TRAVEL" : "REMOTE"}</span><button class="restore-btn" data-restore="${s.id}" title="Restore show">Restore</button></div>
      <div class="m mono">
        <span>${fmtRange(s.tlStart, s.tlEnd)}</span>
        <span class="cty">${esc(s.city || "")}</span>
      </div>
    </div>`;
  };

  const archCollapsed = localStorage.getItem("arch_collapsed") !== "0";
  const archSec = archived.length ? `
    <div class="arch-sec">
      <div class="lsec arch-toggle${archCollapsed ? " collapsed" : ""}" id="archHead" role="button" tabindex="0">
        Archived · ${archived.length}<span class="chev">▾</span>
      </div>
      <div id="archList"${archCollapsed ? ' style="display:none"' : ''}>${archived.map(archRow).join("")}</div>
    </div>` : "";

  document.getElementById("list").innerHTML =
    radarRow +
    `<div class="lsec">Active · ${active.length}</div>` +
    (active.map(row).join("") || `<div class="lrow" style="color:var(--dim)">No active shows</div>`) +
    (wrapped.length ? `<div class="lsec">Recently wrapped</div>` + wrapped.map(row).join("") : "") +
    archSec;

  document.querySelectorAll("#list [data-id]").forEach(el => {
    const go = () => selectShow(el.dataset.id);
    el.addEventListener("click", go);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });

  document.querySelectorAll(".arch-btn[data-arch]").forEach(btn => {
    btn.addEventListener("click", e => { e.stopPropagation(); archiveShow(btn.dataset.arch); });
  });
  document.querySelectorAll(".restore-btn[data-restore]").forEach(btn => {
    btn.addEventListener("click", e => { e.stopPropagation(); unarchiveShow(btn.dataset.restore); });
  });

  const ah = document.getElementById("archHead");
  if (ah) {
    const toggleArch = () => {
      ah.classList.toggle("collapsed");
      const list = document.getElementById("archList");
      list.style.display = ah.classList.contains("collapsed") ? "none" : "";
      localStorage.setItem("arch_collapsed", ah.classList.contains("collapsed") ? "1" : "0");
    };
    ah.addEventListener("click", toggleArch);
    ah.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleArch(); } });
  }
}

function renderStats() {
  const t = today0();
  const active = SHOWS.filter(s => (!s.tlEnd || s.tlEnd >= t) && !isArchived(s));
  const live = active.filter(s => stateOf(s) === "live").length;
  const travel = active.filter(s => s.travel).length;
  const n3 = openCatches().filter(c => c.sev === 3).length;
  const next = active.filter(s => s.tlStart && s.tlStart > t)[0];
  document.getElementById("topStats").innerHTML =
    `<span><b>${active.length}</b> active</span>` +
    (n3 ? `<span class="hot"><b>${n3}</b> need${n3 === 1 ? "s" : ""} action</span>` : "") +
    `<span><b>${live}</b> live</span><span><b>${travel}</b> travel</span>` +
    (next ? `<span>next: <b>${esc(shortTitle(next.title))}</b> ${esc(countdownTxt(next))}</span>` : "");
}

  const s = SHOWS.find(x => x.id === selectedId);
  if (!s) { el.innerHTML = `<div id="msg">${SHOWS.length ? "Select a show" : "No active shows assigned to you in Airtable."}</div>`; return; }
  const t = today0();
  markSeen(s);

  const dl = deadlineOf(s);
  const dateCells = Object.entries(s.dates).filter(([, d]) => d).map(([k, d]) =>

       <div class="k">${k}</div><div class="v mono">${fmtD(d)}${sameDay(d, t) ? " · today" : ""}</div>
     </div>`).join("");

        <span class="mtag ${tagCls}">${tagTxt}</span>
        <span class="ttl">${esc(m.title)}</span>
        ${(m.dateFlags || []).length ? `<span class="flagdot" title="date conflict">${ic("flag")}</span>` : ""}
        <span class="dt mono">${m.date ? fmtD(parseDate(m.date)) : ""}</span>
