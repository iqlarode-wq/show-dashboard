<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Show Ops">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>Show Ops</title>
<!-- build: 2026-10-09 r11 (Resolve / Snooze / In progress on every flag; synced across devices) -->
<style>
  /* Layout idea: the first screen is a sentence and the few things that need a decision.
     Everything else is a closed row with a one-line summary; opening it is the reader's choice,
     and the page remembers which rows that reader keeps open. */
  :root {
    --bg: #0b0d0f;
    --panel: #101316;
    --panel2: #161a1e;
    --line: #1f2429;
    --line2: #2c3239;
    --text: #e9edf1;
    --dim: #8d97a3;
    --faint: #5d6672;
    --accent: #6aaeff;
    --green: #3fcf7c;
    --amber: #e3a83a;
    --red: #ff6257;
    --sel: #151c26;
    --accent-t: rgba(106,174,255,.13);
    --green-t: rgba(63,207,124,.13);
    --amber-t: rgba(227,168,58,.13);
    --red-t: rgba(255,98,87,.13);
    --dim-t: rgba(141,151,163,.12);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; color-scheme: dark; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    font-size: 14px; line-height: 1.45; height: 100dvh; overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  [hidden] { display: none !important; }
  .mono { font-variant-numeric: tabular-nums; }
  .dimtxt { color: var(--dim); }
  .hot { color: var(--red); } .warm { color: var(--amber); } .good { color: var(--green); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .tap { padding: 12px; margin: -12px; display: inline-block; }
  button { font-family: inherit; color: inherit; font-size: inherit; }
  .ic { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2.5px; flex: none; }
  .only-m { display: none; }
  .new { color: var(--accent); }
  .pad { padding: 6px 0; }

  /* ── PIN gate ── */
  #pinGate { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; }
  #pinGate h1 { font-size: 13px; font-weight: 700; letter-spacing: .18em; }
  #pinInput { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; color: var(--text); font-size: 22px; letter-spacing: 10px; text-align: center; padding: 10px 8px; width: 200px; outline: none; }
  #pinInput:focus { border-color: var(--accent); }
  #pinBtn { background: var(--accent); color: #04101f; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; padding: 12px 36px; cursor: pointer; min-height: 44px; }
  #pinErr { color: var(--red); font-size: 13px; min-height: 18px; }

  /* ── Frame ── */
  #app { display: none; height: 100dvh; flex-direction: column; }
  #topbar {
    display: flex; align-items: center; gap: 14px; flex: none;
    padding: env(safe-area-inset-top) 16px 0; min-height: calc(44px + env(safe-area-inset-top));
    border-bottom: 1px solid var(--line);
  }
  #topbar h1 { font-size: 11.5px; font-weight: 700; letter-spacing: .2em; white-space: nowrap; color: var(--dim); }
  #topStats { flex: 1; }
  #updated { color: var(--faint); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #updated.stale { color: var(--amber); }
  #refreshBtn { background: none; border: none; color: var(--dim); border-radius: 8px; min-width: 40px; min-height: 36px; font-size: 16px; cursor: pointer; }
  #refreshBtn:hover { color: var(--text); background: var(--panel2); }
  #main { display: flex; flex: 1; min-height: 0; }

  /* ── Sidebar: one calm line per show ── */
  #list { width: 296px; flex: none; overflow-y: auto; border-right: 1px solid var(--line); padding: 10px 0 env(safe-area-inset-bottom); }
  .nav { display: flex; align-items: center; gap: 10px; margin: 0 8px 6px; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .nav:hover, .srow:hover { background: var(--panel2); }
  .nav.sel, .srow.sel { background: var(--sel); }
  .nav .cnt { margin-left: auto; font-size: 11.5px; font-weight: 700; color: var(--red); background: var(--red-t); border-radius: 999px; min-width: 20px; padding: 1px 7px; text-align: center; }
  .lsec { padding: 14px 18px 6px; color: var(--faint); font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .lsec.tgl { cursor: pointer; user-select: none; }
  .srow { margin: 0 8px; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
  .srow .s1 { display: flex; align-items: center; gap: 8px; }
  .srow .nm { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow .wn { flex: none; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .srow .wn.live { color: var(--green); font-weight: 600; }
  .srow div.s2 { margin: 1px 0 0 15px; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .new { color: var(--accent); }
  .sp { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--line2); }
  .sp.s3 { background: var(--red); box-shadow: 0 0 0 3px var(--red-t); }
  .sp.s2 { background: var(--amber); }
  .sp.s0 { background: var(--green); opacity: .7; }
  .arch-btn { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 11px; padding: 2px 4px; border-radius: 4px; display: none; flex: none; }
  .srow:hover .arch-btn, .srow:focus-within .arch-btn { display: inline-block; }
  .srow:hover .arch-btn + .wn, .srow:focus-within .arch-btn + .wn { display: none; }
  .arch-btn:hover { color: var(--red); }
  .restore-btn { background: none; border: 1px solid var(--line2); color: var(--dim); cursor: pointer; font-size: 10.5px; padding: 2px 8px; border-radius: 4px; flex: none; }
  .restore-btn:hover { color: var(--green); border-color: var(--green); }
  .quiet .srow { opacity: .6; } .quiet .srow:hover { opacity: 1; }
  .chev { font-size: 9px; margin-left: 5px; display: inline-block; transition: transform .15s; }
  .collapsed .chev { transform: rotate(-90deg); }

  /* ── Main pane ── */
  #detail { flex: 1; overflow-y: auto; min-width: 0; }
  #detail .inner { max-width: 860px; padding: 34px 40px calc(80px + env(safe-area-inset-bottom)); }
  #backBtn { display: none; background: none; border: none; color: var(--accent); font-size: 15px; padding: 14px 16px 0; cursor: pointer; }

  /* Brief */
  .bdate { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); display: flex; justify-content: space-between; gap: 12px; }
  .bdate span:last-child { font-weight: 400; letter-spacing: 0; text-transform: none; }
  .bhead { font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -.022em; margin: 10px 0 8px; text-wrap: balance; }
  .bsub { color: var(--dim); font-size: 15px; max-width: 60ch; }
  .bsub b { color: var(--text); font-weight: 600; }
  .heroes { margin-top: 26px; border-top: 1px solid var(--line); }
  .hero { padding: 20px 0 20px 20px; border-bottom: 1px solid var(--line); position: relative; }
  .hero::before { content: ""; position: absolute; left: 0; top: 27px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 4px var(--red-t); }
  .hero-k { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .hero-k i { font-style: normal; color: var(--red); }
  .hero h3 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin: 4px 0 4px; text-wrap: pretty; }
  .hero p { color: var(--dim); max-width: 64ch; }
  .hero-a { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .src { font-size: 11.5px; color: var(--faint); }
  .hero-s { margin-top: 10px; }
  /* Actions on a catch: Resolve / Snooze / In progress. Snooze choices and the note box open in place. */
  .fa { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
  .fa.wide { flex-basis: 100%; }
  .hero-a:has(.fa.wide) > [data-go] { display: none; }
  .fa textarea { flex-basis: 100%; width: 100%; min-height: 58px; background: var(--bg); color: var(--text); border: 1px solid var(--line2); border-radius: 8px; padding: 9px 10px; font: inherit; resize: vertical; }
  .fa textarea:focus { outline: none; border-color: var(--accent); }
  .fa-l { font-size: 12.5px; color: var(--dim); margin-right: 2px; }
  .fa-h { flex-basis: 100%; font-size: 11.5px; color: var(--faint); }
  .fa-m { flex-basis: 100%; font-size: 12px; }
  .nts { margin: 4px 0 8px; border-left: 2px solid var(--line2); padding-left: 10px; }
  .nt { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; padding: 3px 0; font-size: 13px; }
  .nt b { font-weight: 600; font-size: 11.5px; color: var(--dim); flex: none; font-variant-numeric: tabular-nums; }
  .nt span { flex: 1; min-width: 12ch; white-space: pre-wrap; }
  .nt .btn { min-height: 0; padding: 2px 8px; font-size: 11.5px; color: var(--amber); }
  .btn { background: none; border: 1px solid var(--line2); border-radius: 8px; color: var(--text); font-size: 12.5px; font-weight: 600; padding: 6px 12px; min-height: 32px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .btn:hover { border-color: var(--dim); }
  .btn.pri { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.pri:hover { background: #fff; }
  .btn.ghost { border-color: transparent; color: var(--dim); }
  .btn.ghost:hover { color: var(--text); border-color: var(--line2); }
  .secl { margin: 34px 0 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .mshows .srow { margin: 0 -10px; }
  .rwarn { margin: 18px 0 0; padding: 9px 12px; border-radius: 8px; font-size: 12.5px; background: var(--amber-t); color: var(--amber); }

  /* Rows that open: label, one-line summary, chevron */
  .accs { margin-top: 30px; border-top: 1px solid var(--line); }
  .acc { border-bottom: 1px solid var(--line); }
  .acc-h { width: 100%; background: none; border: none; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 15px 2px; min-height: 52px; }
  .acc-h:hover .acc-l { color: #fff; }
  .acc-l { font-size: 15px; font-weight: 600; flex: none; }
  .acc-s { flex: 1; min-width: 0; text-align: right; color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acc-c { color: var(--faint); flex: none; transition: transform .15s; display: grid; }
  .acc.open .acc-c { transform: rotate(90deg); }
  .acc.open .acc-s { opacity: .55; }
  .acc-b { padding: 0 2px 20px; }

  /* A catch as one line; opens to the why and the actions */
  .grp-h { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: none; cursor: pointer; text-align: left; padding: 12px 0 4px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .grp-h:hover { color: var(--text); }
  .grp-h span { color: var(--faint); font-weight: 600; }
  .cl { border-radius: 8px; }
  .cl.open { background: var(--panel); }
  .cl-h { width: 100%; background: none; border: none; cursor: pointer; text-align: left; display: flex; align-items: baseline; gap: 10px; padding: 8px 8px; margin: 0 -8px; width: calc(100% + 16px); border-radius: 8px; }
  .cl.open .cl-h { margin: 0; width: 100%; }
  .cl-h:hover { background: var(--panel2); }
  .pip { width: 7px; height: 7px; border-radius: 50%; flex: none; transform: translateY(-1px); }
  .s3 > .cl-h .pip { background: var(--red); } .s2 > .cl-h .pip { background: var(--amber); } .s1 > .cl-h .pip { border: 1.5px solid var(--faint); }
  .cl-t { flex: 1; min-width: 0; }
  .cl-t b { font-weight: 600; color: var(--dim); margin-right: 8px; }
  .cl-n { display: block; color: var(--dim); font-size: 12.5px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cl.open .cl-n { display: none; }
  .cl.progress > .cl-h .pip { background: var(--accent); border: none; }
  .cl.snoozed > .cl-h .pip, .cl.resolved > .cl-h .pip { background: none; border: 1.5px solid var(--faint); }
  .cl-d { flex: none; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .cl-b { padding: 0 8px 12px 25px; }
  .cl-b p { color: var(--dim); max-width: 64ch; margin-bottom: 6px; }
  .cl-a { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .cl.acked .cl-t { color: var(--dim); }
  details.sub { margin-top: 10px; }
  details.sub summary { padding: 8px 0; font-size: 12.5px; color: var(--dim); cursor: pointer; list-style: none; user-select: none; }
  details.sub summary::-webkit-details-marker { display: none; }
  details.sub summary::before { content: "▸  "; color: var(--faint); }
  details.sub[open] summary::before { content: "▾  "; }
  .none { color: var(--dim); padding: 6px 0; }
  .about { color: var(--dim); font-size: 13px; max-width: 66ch; }

  /* ── Show page ── */
  .sh-k { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: .06em; flex: none; white-space: nowrap; }
  .tag.travel { color: #a9d0ff; background: var(--accent-t); }
  .tag.remote { color: var(--dim); background: var(--dim-t); }
  .tag.live   { color: var(--green); background: var(--green-t); }
  .tag.urgent { color: var(--amber); background: var(--amber-t); }
  .tag.you    { color: var(--text); background: var(--dim-t); margin-left: 6px; }
  .sh-h { font-size: 30px; line-height: 1.12; font-weight: 700; letter-spacing: -.02em; margin: 10px 0 6px; }
  .sh-meta { color: var(--dim); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .sh-status { margin: 14px 0 0; font-size: 15px; }
  .sh-status b { font-weight: 600; }
  .datebar { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; margin: 22px 0 0; }
  .datebar .d { flex: 1; min-width: 84px; padding: 10px 12px; border-right: 1px solid var(--line); }
  .datebar .d:last-child { border-right: none; }
  .datebar .k { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; white-space: nowrap; }
  .datebar .v { font-size: 14px; font-weight: 600; margin-top: 2px; white-space: nowrap; }
  .datebar .d.today { background: var(--amber-t); } .datebar .d.today .v { color: var(--amber); }
  .datebar .d.ship:not(.past) .v, .datebar .d.ship:not(.past) .k { color: var(--amber); }
  .datebar .d.past .v { color: var(--faint); font-weight: 400; }
  #wx { display: flex; gap: 14px; overflow-x: auto; margin: 10px 0 0; font-size: 12px; color: var(--dim); white-space: nowrap; }
  #wx:empty { display: none; }
  #wx .w b { color: var(--text); font-weight: 600; }
  .links { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 18px 0 0; font-size: 13px; font-weight: 600; }
  .links a, .links button { background: none; border: none; color: var(--text); cursor: pointer; padding: 4px 0; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
  .links a:hover, .links button:hover { color: var(--accent); }
  .links .arr { color: var(--faint); font-weight: 400; }
  #shHero .heroes { margin-top: 22px; }

  .pf { display: flex; flex-wrap: wrap; gap: 7px; }
  .pfc { font-size: 12.5px; border: 1px solid var(--line2); border-radius: 999px; padding: 3px 11px; color: var(--dim); white-space: nowrap; }
  .pfc b { font-weight: 600; color: var(--text); margin-left: 6px; }
  .pfc.ok b { color: var(--green); } .pfc.warn b { color: var(--amber); } .pfc.bad b { color: var(--red); }

  .cr { display: grid; grid-template-columns: minmax(0,1fr) auto; grid-template-areas: "n s" "d a" "x x"; gap: 3px 14px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .cr:last-child { border-bottom: none; }
  .cr.am { grid-template-areas: "n a"; }
  .cr .n { grid-area: n; font-weight: 600; min-width: 0; }
  .cr .role { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 7px; }
  .cr .dts { grid-area: d; color: var(--dim); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cr .st { grid-area: s; font-size: 12.5px; white-space: nowrap; text-align: right; }
  .cr .act { grid-area: a; display: flex; gap: 14px; justify-content: flex-end; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 13px; }
  .cr .x { grid-area: x; color: var(--dim); font-size: 12px; }
  .cr .x:empty { display: none; }
  .stat-ok { color: var(--green); } .stat-pencil { color: var(--amber); } .stat-other { color: var(--dim); }

  .mail { border-bottom: 1px solid var(--line); }
  .mail:last-child { border-bottom: none; }
  .mail > .hd { display: flex; gap: 10px; padding: 10px 0; cursor: pointer; align-items: baseline; }
  .mail > .hd:hover .sub { color: var(--text); }
  .mail .from { font-weight: 600; white-space: nowrap; flex: none; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  .mail .sub { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  .mail.open .sub { white-space: normal; color: var(--text); }
  .mail .dt { color: var(--faint); font-size: 12px; white-space: nowrap; flex: none; }
  .mail .body { display: none; padding: 4px 0 12px; color: #c6cdd5; font-size: 13px; white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow-y: auto; }
  .mail.open .body { display: block; }
  .mail .to { color: var(--dim); font-size: 11.5px; display: none; }
  .mail.open .to { display: block; }
  .mailfoot { padding: 12px 0 0; font-size: 12.5px; }

  .mtg { border-bottom: 1px solid var(--line); }
  .mtg:last-child { border-bottom: none; }
  .mtg > .hd { display: flex; gap: 10px; padding: 10px 0; cursor: pointer; align-items: baseline; }
  .mtg .ttl { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mtg.open .ttl { white-space: normal; }
  .mtg .dt { color: var(--faint); font-size: 12px; white-space: nowrap; flex: none; }
  .mtg .mtag { font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 3px; letter-spacing: .05em; flex: none; }
  .mtag.spec { color: var(--green); background: var(--green-t); }
  .mtag.ment { color: var(--dim); background: var(--dim-t); }
  .flagdot { color: var(--amber); flex: none; }
  .mtg .body { display: none; padding: 2px 0 12px; }
  .mtg.open .body { display: block; }
  .mtg .rel { color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin-bottom: 5px; }
  .mtg .sum { color: #c6cdd5; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .mtg .ai { margin: 9px 0 0; padding: 8px 10px; background: var(--panel2); border-radius: 6px; }
  .mtg .ai .h { font-size: 10.5px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .mtg .ai ul { margin: 0; padding-left: 16px; }
  .mtg .ai li { font-size: 13px; margin: 2px 0; }
  .mtg .dflag { margin-top: 9px; padding: 7px 10px; border-radius: 6px; font-size: 12.5px; background: var(--amber-t); color: var(--amber); }

  #notesView { white-space: pre-wrap; }
  #notesEdit { display: none; padding-top: 4px; }
  #notesEdit textarea { width: 100%; min-height: 120px; background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 8px; padding: 10px; font: inherit; resize: vertical; }
  #notesEdit .row2 { display: flex; gap: 8px; margin-top: 8px; }
  #notesEdit button { border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; min-height: 38px; }
  #notesSave { background: var(--text); color: var(--bg); border: none; font-weight: 700; }
  #notesCancel { background: none; color: var(--dim); border: 1px solid var(--line2); }

// ════════════════════════════════════════════════
// API LAYER
// ════════════════════════════════════════════════
function pin() { return localStorage.getItem("dash_pin") || ""; }

async function api(table, params, method, recordId, body) {
  const qs = new URLSearchParams();
  for (const [k, v] of Object.entries(params || {})) {
    if (Array.isArray(v)) v.forEach(x => qs.append(k, x));
    else qs.append(k, v);
  }
  qs.append("key", pin());
  const base = `${WORKER}/v0/${BASE}/${encodeURIComponent(table)}` + (recordId ? `/${recordId}` : "");
  if (method === "PATCH") {
    const res = await fetch(`${base}?${qs}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (res.status === 401) { const e = new Error("PIN rejected"); e.auth = true; throw e; }
    const data = await res.json();
    if (!res.ok || data.error) throw new Error((data.error && (data.error.message || data.error)) || ("HTTP " + res.status));
    return data;
  }
  let url = `${base}?${qs}`;
  let out = [];
  for (let page = 0; page < 6; page++) {
    const res = await fetch(url);
    if (res.status === 401) { const e = new Error("PIN rejected"); e.auth = true; throw e; }
    if (!res.ok) throw new Error(`Airtable error ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || data.error);
    out = out.concat(data.records || []);
    if (!data.offset) break;
    url = `${base}?${qs}&offset=${data.offset}`;
  }
  return out;
}

// ════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const first = v => Array.isArray(v) ? v[0] : v;

function parseDate(v) {
  v = first(v);
  if (!v) return null;
  if (v instanceof Date) return v;
  let m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3], 12);
  m = String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return new Date(+m[3], +m[1]-1, +m[2], 12);
  const d = new Date(v);
  return isNaN(d) ? null : d;
}
function today0() { const d = new Date(); d.setHours(12,0,0,0); return d; }
function daysFromToday(d) { return Math.round((d - today0()) / 86400000); }
function fmtD(d) { return d ? d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "—"; }
function sameDay(a, b) { return a && b && a.toDateString() === b.toDateString(); }
function fmtRange(a, b) {
  if (!a && !b) return "";
  if (a && b) {
    if (a.getTime() === b.getTime()) return fmtD(a);
    if (a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear())
      return fmtD(a) + "–" + b.getDate();          // Jun 13–21
    return fmtD(a) + " – " + fmtD(b);
  }
  return fmtD(a || b);
}
function agoTxt(d) {
  const n = -daysFromToday(d);
  if (n <= 0) return "today";
  if (n === 1) return "1d ago";
  return n + "d ago";
}
function titleName(s) {
  return String(s || "").split(/\s+/).map(w => w ? w[0].toUpperCase() + w.slice(1) : w).join(" ");
}
function senderName(from) {
  if (!from) return "";
  const f = String(from);
  return titleName(f.includes("@") ? f.split("@")[0].replace(/[._]/g, " ") : f);
}
function fmtPhone(p) {
  let d = String(p).replace(/\D/g, "");
  if (d.length === 11 && d[0] === "1") d = d.slice(1);
  if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  return String(p);
}
function telHref(p) { return "tel:" + String(p).replace(/[^\d+]/g, ""); }
function cleanBody(b) {
  let t = String(b || "");
  t = t.replace(/\[([^\]]*)\]\(([^)]*)\)/g, (m, txt, url) => {
    if (!txt || /^https?:/.test(txt)) return /sophos|wearesparks|facebook|instagram|linkedin|youtube/i.test(url) ? "" : (txt || url);
    return txt;
  });
  t = t.split("\n").filter(line =>
    !/protection\.sophos\.com/.test(line) &&
    !/^<?https?:\/\/(www\.)?(facebook|instagram|youtube|linkedin)\./.test(line.trim()) &&
    !/This email and any attachments are intended only for the person/.test(line)
  ).join("\n");
  t = t.replace(/\*\*([^*]*)\*\*/g, "$1")
       .replace(/\\\*/g, "")
       .replace(/^\s*[#>]{1,6}\s*/gm, "")
       .replace(/\n{3,}/g, "\n\n")
       .trim();
  return t;
}
function extractEmails(s) {
  return [...new Set((String(s || "").match(/[\w.+-]+@[\w.-]+\.\w+/g) || []).map(x => x.toLowerCase()))];
}

// seen-email tracking (new-mail badges)
function seenKey(id) { return "seen_" + id; }
function latestMailTime(s) { return s.mailMeta[0] && s.mailMeta[0].date ? s.mailMeta[0].date.getTime() : 0; }
function newMailCount(s) {
  const seen = +localStorage.getItem(seenKey(s.id));
  if (!seen) { localStorage.setItem(seenKey(s.id), String(latestMailTime(s) || 1)); return 0; }
  return s.mailMeta.filter(m => m.date && m.date.getTime() > seen).length;
}
function markSeen(s) { if (s) localStorage.setItem(seenKey(s.id), String(Math.max(latestMailTime(s), 1))); }

// new-meeting tracking + flag count
function mtgSeenKey(id) { return "mtgseen_" + id; }
function mtgTime(m) { const d = parseDate(m.date); return d ? d.getTime() : 0; }
function latestMtgTime(s) { return (s.meetings || []).reduce((mx, m) => Math.max(mx, mtgTime(m)), 0); }
function newMtgCount(s) {
  if (!s.meetings || !s.meetings.length) return 0;
  const seen = +localStorage.getItem(mtgSeenKey(s.id));
  if (!seen) { localStorage.setItem(mtgSeenKey(s.id), String(latestMtgTime(s) || 1)); return 0; }
  return s.meetings.filter(m => mtgTime(m) > seen).length;
}
function markMtgSeen(s) { if (s && s.meetings && s.meetings.length) localStorage.setItem(mtgSeenKey(s.id), String(Math.max(latestMtgTime(s), 1))); }
function mtgFlagCount(s) { return (s.meetings || []).reduce((n, m) => n + ((m.dateFlags || []).length), 0); }

// ════════════════════════════════════════════════

  const d = autoArchiveDate(s);

function isArchived(s) {
  if (_archivedIds.includes(s.id)) return true;

}
function archiveShow(id) {
  if (!_archivedIds.includes(id)) _archivedIds.push(id);

function unarchiveShow(id) {

const REMOTE_OVERRIDE = [
  "recaVfmNbH94gsnYE"   // JM Vertex @ ASN 2026 — remote oversight per Iq, 2026-10-08
];
const isRemoteMe = (eid, name) => REMOTE_OVERRIDE.includes(eid) && String(name || "").includes(ME);

// ════════════════════════════════════════════════
// NAMING HELPERS
// ════════════════════════════════════════════════
// "JM Vertex @ ASN 2026 #713 Prep + Show" → "Vertex @ ASN"
function shortTitle(t) {
  const s = String(t || "")
    .replace(/\s*#.*$/, "")
    .replace(/\s+20\d\d\b/g, "")
    .replace(/\s*Prep \+ Show\s*$/i, "")
    .replace(/^(?:\(AR\)\s+|Calendar:\s+)?(?:SPX|JM|SS|IXM|IMP|MMS|XL P&O|P&O|Prospect)\s+/, "")
    .trim();
  return s || String(t || "");
}
function boothOf(s) { return s.booth ? "#" + s.booth : ""; }
// "*Jonathan (Johnny) Jordan" → "Johnny J." · "*Iqral La Rode" → "You"
function nick(name) {
  const n = String(name || "").replace(/^\*/, "").trim();
  if (n.includes(ME)) return "You";
  const p = n.match(/\(([^)]+)\)/);
  const parts = n.replace(/\([^)]*\)/g, " ").split(/\s+/).filter(Boolean);
  const firstName = p ? p[1] : (parts[0] || n);
  const last = parts.length > 1 ? parts[parts.length - 1] : "";
  return last ? `${firstName} ${last[0]}.` : firstName;
}
function listNames(arr) {
  const a = arr.map(n => n === "You" ? "you" : n);
  if (a.length <= 1) return a.join("");
  return a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
}
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const dd = (a, b) => Math.round((a - b) / 86400000);
const validQuote = q => !!q && /^\d{4,}$/.test(q);
const fq = s => String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
function dueTxt(d) {
  const n = daysFromToday(d);
  if (n < -1) return (-n) + "d ago";
  if (n === -1) return "yesterday";
  if (n === 0) return "today";
  if (n === 1) return "tomorrow";
  return "in " + n + "d";
}

// ════════════════════════════════════════════════
// DATA LOAD
// ════════════════════════════════════════════════
function applyData(events, positions, mails, fromCache) {
  RAW = { events, positions, mails };
  SHOWS = events.map(e => buildModel(e, positions, mails))
    .sort((a, b) => (a.tlStart || 0) - (b.tlStart || 0));
  if (selectedId !== "radar" && !SHOWS.find(s => s.id === selectedId)) selectedId = "radar";
  computeRadar();
  renderList();
  renderStats();
  if (!flagEditing()) renderDetail();
  const up = document.getElementById("updated");
  if (fromCache) { up.textContent = "Cached — refreshing…"; up.classList.add("stale"); }
  else {
    up.textContent = "Live " + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    up.classList.remove("stale");
  }
}

function notesEditing() {
  const e = document.getElementById("notesEdit");
  return !!e && e.style.display === "block";
}

async function loadAll() {
  document.getElementById("errBar").style.display = "none";
  document.getElementById("refreshBtn").innerHTML = '<span class="spin">↻</span>';

  try {
    const events = await api(EVENTS_TBL, {
      view: IQRAL_VIEW,
      filterByFormula: `IS_AFTER({Timeline End},DATEADD(TODAY(),-${WRAPPED_LOOKBACK},'days'))`,
      "fields[]": EVENT_FIELDS
    });

    // Merge pinned shows the view filtered out (see PINNED_EVENTS above)
    const pinMissing = PINNED_EVENTS.filter(id => !events.some(e => e.id === id));
    if (pinMissing.length) {
      const pinFormula = "OR(" + pinMissing.map(id => `RECORD_ID()='${id}'`).join(",") + ")";
      const pinned = await api(EVENTS_TBL, { filterByFormula: pinFormula, "fields[]": EVENT_FIELDS });
      events.push(...pinned);
    }

    // Granola notes (personal layer — KV via worker, never touches Airtable)
    fetch(`${WORKER}/notes?key=${encodeURIComponent(pin())}`)
      .then(r => r.ok ? r.json() : null)
      .then(nd => {
        if (!nd || !nd.shows) return;
        NOTES = nd;
        try { localStorage.setItem("dash_notes", JSON.stringify(nd)); } catch (e) {}
        SHOWS.forEach(s => { s.meetings = nd.shows[s.id] || []; });
        computeRadar();
        renderList(); renderStats();
        if (!notesEditing() && !flagEditing()) renderDetail();
      })
      .catch(() => {});

    let positions = [], mails = [];
    const ids = events.map(e => e.id);

    const jobs = [];
    if (ids.length) {
      const posFormula = "OR(" + ids.map(id => `FIND('${id}',ARRAYJOIN({id (from Event)}))`).join(",") + ")";
      jobs.push(api(POS_TBL, { filterByFormula: posFormula, "fields[]": POS_FIELDS }).then(r => positions = r));
    }
    // Emails: match on quote number; shows without a real quote number match on the event name instead.
    const mailTerms = events.map(e => {
      const q = e.fields["QuoteNumber(string)"];
      if (validQuote(q)) return `FIND('${q}',ARRAYJOIN({Related Event})&' '&{Subject})`;
      const n = String(e.fields["Name"] || "").trim();
      return n ? `FIND('${fq(n)}',ARRAYJOIN({Related Event}))` : null;
    }).filter(Boolean);
    if (mailTerms.length) {
      jobs.push(api(MAIL_TBL, {
        filterByFormula: "OR(" + mailTerms.join(",") + ")",
        "fields[]": MAIL_META_FIELDS,
        "sort[0][field]": "Received Date",
        "sort[0][direction]": "desc",
        pageSize: 100
      }).then(r => mails = r).catch(() => mails = []));
    }
    await Promise.all(jobs);

    lastLoad = Date.now();
    Object.keys(mailCache).forEach(k => delete mailCache[k]);
    try { localStorage.setItem("dash_cache", JSON.stringify({ t: lastLoad, events, positions, mails })); } catch (e) {}

    applyData(events, positions, mails, false);
    loadRadar(events, positions);   // second pass: cross-source checks; never blocks the page
  } catch (err) {
    if (err.auth) { localStorage.removeItem("dash_pin"); showGate("PIN no longer valid — re-enter."); return; }
    document.getElementById("errTxt").textContent = "Couldn't load data: " + err.message;
    document.getElementById("errBar").style.display = "block";
    const up = document.getElementById("updated");
    if (RAW) { up.textContent = "Offline — showing cached"; up.classList.add("stale"); }
  } finally {
    document.getElementById("refreshBtn").innerHTML = "↻";
  }
}

function buildModel(ev, positions, mails) {
  const f = ev.fields;
  const combined = f["Combined Name"] || f["Name"] || "Untitled";
  const title = combined.split("•")[0].replace(/#\s*$/, "").trim();

  const crew = positions
    .filter(p => {
      const pid = p.fields["id (from Event)"];
      return Array.isArray(pid) ? pid.includes(ev.id) : pid === ev.id;
    })
    .map(p => {
      const pf = p.fields;
      const starts = [].concat(pf["Start (from Timeline Dates)"] || []);
      const ends = [].concat(pf["End (from Timeline Dates)"] || []);
      let stints = starts.map((st, i) => ({ a: parseDate(st), b: parseDate(ends[i]) })).filter(x => x.a || x.b);
      if (!stints.length && (pf["Timeline Start"] || pf["Timeline End"])) {
        stints = [{ a: parseDate(pf["Timeline Start"]), b: parseDate(pf["Timeline End"]) }];
      }
      const raw = first(pf["Name (from Crew)"]) || "";
      const role = first(pf["Short Name (from Roles)"]) || "";
      return {
        raw,
        name: raw.replace(/^\*/, "").trim(),
        email: first(pf["Email (from Crew)"]) || "",
        phone: first(pf["Phone Number (from Crew)"]) || "",
        role,
        staff: role === "Staff",
        remoteMe: isRemoteMe(ev.id, raw),
        status: String(pf["Status"] || "").trim(),
        stints,
        notes: pf["Position Notes"] || "",
        travelInfo: [first(pf["Flight/Hotel Info"]), first(pf["Hotel Info"])].filter(Boolean).join(" · ").trim()
      };
    })
    .filter(c => c.name);

  const quoteStr = f["QuoteNumber(string)"] || "";
  const myMails = mails.filter(m =>
    (m.fields["Related Event"] || []).includes(ev.id) ||
    (validQuote(quoteStr) && String(m.fields["Subject"] || "").includes(quoteStr)));

  return {
    id: ev.id, title,
    quote: validQuote(quoteStr) ? quoteStr : "",
    booth: f["Booth Number"] || ((String(f["Name"] || "").match(/#\s*([A-Za-z0-9][A-Za-z0-9-]*)/) || [])[1] || ""),
    status: f["Status"] || "",
    venue: String(first(f["Venue"]) || "").trim(),
    address: first(f["Venue Address Combined"]) || "",
    city: f["Venue City"] || "",
    cityState: [f["Venue City"], f["Venue State"]].filter(Boolean).join(", "),
    tlStart: parseDate(f["Timeline Start"]),
    tlEnd: parseDate(f["Timeline End"]),
    dates: {
      "Booth Ship": parseDate(f["Booth Ship Date"]),
      "Travel In": parseDate(f["Travel In"]),
      "Load In": parseDate(f["Load In"]),
      "Show Start": parseDate(f["Show Start"]),
      "Show End": parseDate(f["Show End"]),
      "Load Out": parseDate(f["Load Out"]),
      "Travel Out": parseDate(f["Travel Out"])
    },
    links: {
      "Dropbox": f["Dropbox URL"], "Content": f["Dropbox Content URL"],
      "AV Binder": first(f["AV Binder Live Link"]), "InfoDoc": first(f["infoDocs link"])
    },
    am: {
      name: (first(f["Account Manager Name"]) || "").replace(/^\*/, ""),
      phone: first(f["Account Manager Phone"]) || "",
      email: first(f["Account Manager Name Email"]) || ""
    },
    pmNotes: f["PM Notes"] || "",
    clientNotes: f["Client Notes"] || "",
    meetings: (NOTES.shows && NOTES.shows[ev.id]) || [],
    crew,
    travel: crew.some(c => c.name.includes(ME) && !c.remoteMe),
    remoteOverride: crew.some(c => c.remoteMe),
    mailTotal: Math.max((f["Zapier Emails"] || []).length, myMails.length),
    mailMeta: myMails.map(m => ({
      id: m.id,
      from: senderName(m.fields["From"]),
      subj: m.fields["Subject"] || "(no subject)",
      date: parseDate(m.fields["Received Date"])
    }))
  };
}

// ════════════════════════════════════════════════
// STATE HELPERS
// ════════════════════════════════════════════════
// Real deadline = Booth Ship Date when it lands before load-in (or when there's no load-in yet).
// Once the ship date has passed, the deadline reverts to load-in.
function deadlineOf(s) {
  const ship = s.dates["Booth Ship"];
  const loadIn = s.dates["Load In"] || s.tlStart;
  if (ship && ship >= today0() && (!loadIn || ship < loadIn)) return { d: ship, label: "ship", ship: true };
  return { d: loadIn, label: "load-in", ship: false };
}
function stateOf(s) {
  const t = today0();
  if (s.tlEnd && s.tlEnd < t) return "done";
  if (s.tlStart && s.tlStart <= t) return "live";
  const dl = deadlineOf(s).d;
  const d = dl ? daysFromToday(dl) : null;
  if (d !== null && d <= URGENT_DAYS) return "urgent";
  return "upcoming";
}
function countdownTxt(s) {
  const st = stateOf(s);
  if (st === "done") return "wrapped " + agoTxt(s.tlEnd);
  if (st === "live") return "LIVE thru " + fmtD(s.tlEnd);
  const dl = deadlineOf(s);
  if (!dl.d) return "dates TBD";
  const d = daysFromToday(dl.d);
  const verb = dl.ship ? "ships" : "load-in";
  return d === 0 ? verb + " TODAY" : verb + " in " + d + "d";
}
function crewRisk(s) {
  const st = stateOf(s);
  if (st !== "urgent" && st !== "live") return null;
  if (!s.crew.length) return { level: "red", txt: "NO CREW ASSIGNED" };
  const pencilled = s.crew.filter(c => String(c.status).toLowerCase().includes("pencil")).length;
  if (pencilled) return { level: "amber", txt: pencilled + " crew still pencilled" };
  return null;
}

// OPEN/CLOSED STATE — every section starts closed; the page remembers what this reader opens

let _ui = {};
try { _ui = JSON.parse(localStorage.getItem("ui_open") || "{}") || {}; } catch (e) { _ui = {}; }
const isOpen = (id, def) => id in _ui ? !!_ui[id] : !!def;
function setOpen(id, v) {
  _ui[id] = v ? 1 : 0;
  try { localStorage.setItem("ui_open", JSON.stringify(_ui)); } catch (e) {}
}
// A row that opens: label on the left, a one-line summary on the right, the detail underneath.
function acc(id, label, summary, body) {
  const o = isOpen(id, false);
  return `<section class="acc${o ? " open" : ""}" data-acc="${id}">
    <button class="acc-h" aria-expanded="${o}"><span class="acc-l">${label}</span><span class="acc-s" data-accs="${id}">${summary || ""}</span><span class="acc-c">${ic("chev")}</span></button>
    <div class="acc-b" data-accb="${id}"${o ? "" : " hidden"}>${body}</div>
  </section>`;
}
function wireAcc(root, onOpen) {
  root.querySelectorAll(".acc-h").forEach(h => h.addEventListener("click", () => {
    const sec = h.parentElement, id = sec.dataset.acc, o = !sec.classList.contains("open");
    sec.classList.toggle("open", o);
    h.setAttribute("aria-expanded", String(o));
    sec.querySelector(".acc-b").hidden = !o;
    setOpen(id, o);
    if (o && onOpen) onOpen(id);
  }));
}
const accBody = id => document.querySelector(`[data-accb="${id}"]`);
const accSum = (id, html) => { const e = document.querySelector(`[data-accs="${id}"]`); if (e) e.innerHTML = html; };

let _homeScroll = 0;
function selectShow(id) {
  const pane = document.getElementById("detail");
  if (selectedId === "radar" && id !== "radar") _homeScroll = pane.scrollTop;
  selectedId = id;
  renderList(); renderDetail();

}

// ════════════════════════════════════════════════
// RENDER — show rows (sidebar on a laptop, inside the brief on a phone)
// ════════════════════════════════════════════════
function whenTxt(s) {
  const st = stateOf(s);
  if (st === "done") return "Wrapped";
  if (st === "live") return "Live";
  const dl = deadlineOf(s);
  if (!dl.d) return "Dates TBD";
  const d = daysFromToday(dl.d);
  const verb = dl.ship ? "Ships" : "Loads in";
  if (d === 0) return verb + " today";
  if (d === 1) return verb + " tomorrow";
  return dl.ship ? `Ships in ${d}d` : `Load-in ${d}d`;
}
function showCounts(id) {
  const o = { n3: 0, n2: 0, n1: 0, prog: 0, snz: 0, ack: 0 };
  RADAR.catches.forEach(c => {
    if (c.showId !== id) return;
    const st = stOf(c);
    if (st === "resolved") o.ack++; else if (st === "snoozed") o.snz++; else if (st === "progress") o.prog++; else o["n" + c.sev]++;
  });
  return o;
}
function showRow(s, opts) {
  const o = opts || {};
  const st = stateOf(s);
  const k = showCounts(s.id);
  const checked = !!RADAR.t;
  const dot = st === "done" ? "" : k.n3 ? " s3" : (k.n2 || k.prog) ? " s2" : checked ? " s0" : "";
  const bits = [s.travel ? "Travel" : "Remote"];
  if (st === "done") bits.push(esc(agoTxt(s.tlEnd)) + (k.n1 ? " · tasks still open" : ""));
  else if (k.n3) bits.push(`<span class="hot">${k.n3} need${k.n3 === 1 ? "s" : ""} you</span>`);
  else if (k.prog) bits.push(`${k.prog} in progress`);
  else if (k.n2) bits.push(`${k.n2} to watch`);
  else if (checked) bits.push("On track");
  const nNew = newMailCount(s);
  if (nNew) bits.push(`<span class="new">${nNew} new email${nNew === 1 ? "" : "s"}</span>`);
  if (newMtgCount(s)) bits.push(`<span class="new">new call notes</span>`);
  const btn = o.restore ? `<button class="restore-btn" data-restore="${s.id}" title="Restore show">Restore</button>`
    : `<button class="arch-btn" data-arch="${s.id}" title="Archive show" aria-label="Archive ${esc(s.title)}">✕</button><span class="wn${st === "live" ? " live" : ""}">${esc(whenTxt(s))}</span>`;
  return `<div class="srow${s.id === selectedId ? " sel" : ""}" data-id="${s.id}" tabindex="0" role="button" title="${esc(s.title)} · ${esc(fmtRange(s.tlStart, s.tlEnd))}">
    <div class="s1"><span class="sp${dot}"></span><span class="nm">${esc(shortTitle(s.title))}</span>${btn}</div>
    <div class="s2">${bits.join(" · ")}</div>
  </div>`;
}
function showGroups() {
  const t = today0();
  return {
    active: SHOWS.filter(s => (!s.tlEnd || s.tlEnd >= t) && !isArchived(s)),
    wrapped: SHOWS.filter(s => s.tlEnd && s.tlEnd < t && !isArchived(s)).reverse(),
    archived: SHOWS.filter(s => isArchived(s))
  };
}
// Active shows, then two quiet folds. `where` keeps the sidebar's and the phone list's fold state apart.
function showListHtml(where) {
  const g = showGroups();
  const sec = (id, label, rows) => {
    if (!rows) return "";
    const o = isOpen(where + "." + id, false);
    return `<div class="lsec tgl${o ? "" : " collapsed"}" data-tgl="${where}.${id}" role="button" tabindex="0" aria-expanded="${o}">${label}<span class="chev">▾</span></div>
      <div class="quiet"${o ? "" : " hidden"}>${rows}</div>`;
  };
  return (g.active.map(s => showRow(s)).join("") || `<div class="srow dimtxt">No active shows</div>`) +
    sec("wrapped", `Recently wrapped · ${g.wrapped.length}`, g.wrapped.map(s => showRow(s)).join("")) +
    sec("arch", `Archived · ${g.archived.length}`, g.archived.map(s => showRow(s, { restore: true })).join(""));
}
function wireShowList(root) {
  const key = (el, fn) => el.addEventListener("keydown", e => { if (e.target === el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); fn(); } });
  root.querySelectorAll("[data-id]").forEach(el => {
    const go = () => selectShow(el.dataset.id);
    el.addEventListener("click", go); key(el, go);
  });
  root.querySelectorAll(".arch-btn[data-arch]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); archiveShow(b.dataset.arch); }));
  root.querySelectorAll(".restore-btn[data-restore]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); unarchiveShow(b.dataset.restore); }));
  root.querySelectorAll("[data-tgl]").forEach(h => {
    const tg = () => {
      const o = h.classList.contains("collapsed");
      h.classList.toggle("collapsed", !o); h.setAttribute("aria-expanded", String(o));
      h.nextElementSibling.hidden = !o; setOpen(h.dataset.tgl, o);
    };
    h.addEventListener("click", tg); key(h, tg);
  });
}

function showStatusHtml(s) {
  if (stateOf(s) === "done") {
    const k = showCounts(s.id);
    return `Wrapped ${esc(agoTxt(s.tlEnd))}.${k.n1 ? " Tasks still open." : ""}`;
  }
  if (RADAR.loading && !RADAR.t) return `<span class="dimtxt">Checking…</span>`;
  const k = showCounts(s.id);
  const rest = [k.prog ? `${k.prog} in progress.` : "", k.n2 ? `${k.n2} ${k.n3 ? "more " : ""}to watch.` : ""].filter(Boolean).join(" ");
  if (k.n3) return `<b class="hot">${k.n3} thing${k.n3 === 1 ? "" : "s"} need${k.n3 === 1 ? "s" : ""} you.</b>${rest ? ` <span class="dimtxt">${rest}</span>` : ""}`;
  if (rest) return `<b>Nothing needs you.</b> <span class="dimtxt">${rest}</span>`;
  return `<b class="good">On track.</b> <span class="dimtxt">Nothing flagged.</span>`;
}
function crewSummary(s) {
  if (!s.crew.length) return `<span class="hot">none assigned</span>`;
  const pen = s.crew.filter(c => /pencil/i.test(c.status)).length;
  const nc = s.crew.filter(c => /not conf/i.test(c.status)).length;
  const emp = s.crew.filter(c => /^empty$/i.test(c.status)).length;
  const bits = [];
  if (pen) bits.push(`${pen} pencilled`);
  if (nc) bits.push(`${nc} not confirmed`);
  if (emp) bits.push(`${emp} empty`);
  return `${s.crew.length} · ` + (bits.length ? `<span class="warm">${bits.join(", ")}</span>` : "all confirmed");
}

function renderDetail() {
  const el = document.getElementById("detailInner");
  document.body.classList.toggle("home", selectedId === "radar");
  if (selectedId === "radar") { renderRadarHome(el); return; }
  const s = SHOWS.find(x => x.id === selectedId);
  if (!s) { el.innerHTML = `<div id="msg">${SHOWS.length ? "Select a show" : "No active shows assigned to you in Airtable."}</div>`; return; }
  const t = today0();
  const st = stateOf(s);

  const dl = deadlineOf(s);
  const dateCells = Object.entries(s.dates).filter(([, d]) => d).map(([k, d]) =>
    `<div class="d ${sameDay(d, t) ? "today" : (d < t ? "past" : "")}${k === "Booth Ship" && dl.ship ? " ship" : ""}">
       <div class="k">${k}</div><div class="v mono">${fmtD(d)}${sameDay(d, t) ? " · today" : ""}</div>
     </div>`).join("");

  // ── Crew ──
  const fmtStints = c => c.stints.map(x => fmtRange(x.a, x.b)).join(", ") || "—";
  const amRow = s.am.name ? `<div class="cr am">
      <div class="n">${esc(s.am.name)}<span class="role">AM</span></div>
      <div class="act">${s.am.phone ? `<a class="tap" href="${telHref(s.am.phone)}" aria-label="Call ${esc(s.am.name)}">${esc(fmtPhone(s.am.phone))}</a>` : ""}${s.am.email ? `<a class="tap" href="mailto:${esc(s.am.email)}" aria-label="Email ${esc(s.am.name)}">${ic("mail")}</a>` : ""}</div>
    </div>` : "";
  const crewRows = s.crew.map(c => {
