// ════════════════════════════════════════════════
// RADAR — cross-source checks, computed live on every load
//   Reads only. Sources: Events (RentalWorks sync fields), EventPositions
//   (this show + every other show the same crew is on), Tasks, Zapier Emails,
//   Granola notes (worker KV), and analyst catches (worker KV /radar).
// ════════════════════════════════════════════════
const TASKS_TBL = "tbl5RQ4eWcGKrwNDR";
const RADAR_EVENT_FIELDS = ["Event Type","LoadIn Check","LoadOut Check","ShipDate Check",
  "RWSynced LoadInDate","RWSynced LoadOutDate","RWSynced ShipDate","RWSynced Status",
  "Drawing Needed","Drawing Status","loadCalcsNeeded","Rigging Needed","Infodoc Email Sent"];
const XPOS_FIELDS = ["Name (from Crew)","Status","Timeline Start","Timeline End","Name (from Event)","Event Type (from Event)","id (from Event)"];
const TASK_META_FIELDS = ["Name","Due Date","Due Status","Task Status","id (from Events)","Catagory (from Task Templates)"];
const TASK_FULL_FIELDS = TASK_META_FIELDS.concat(["Display Order (from Task Templates)"]);
const TASK_CATS = { rechEuafECj32ks0I: "Pre-show", recU899JCkjcTgPbc: "During show", rec0d87nt85oP25AL: "Post-show" };
const TASK_CAT_ORDER = ["rechEuafECj32ks0I", "recU899JCkjcTgPbc", "rec0d87nt85oP25AL"];
const TASK_STATUSES = ["Not Started", "In Process", "Done", "Not Needed"];

let RADAR = { t: 0, loading: false, errs: [], extra: {}, tasks: [], xpos: [], analyst: [], catches: [] };
// ── What Iq has done about each catch ──
// FLAGS[key] = { st: "resolved" | "snoozed" | "progress" | "open", t, until?, notes?: [{ t, text, at }] }
//   resolved  hidden until the facts change (the key changes, so the catch comes back as new)
//   snoozed   hidden until `until`
//   progress  stays in view under "In progress" with his notes; leaves the "needs you" count
//   open      back to normal (kept as a record so the choice syncs to his other devices)
// Stored in this browser and mirrored to the worker (/flags) so phone and laptop agree.
// A note's `at` is 1 once it is also in the show's PM Notes in Airtable, 0 if that write failed.
let FLAGS = {};
try { FLAGS = JSON.parse(localStorage.getItem("flag_state") || "{}") || {}; } catch (e) { FLAGS = {}; }
try {   // carry over acknowledgements from before r11
  const old = JSON.parse(localStorage.getItem("radar_ack") || "null");
  if (old) {
    Object.keys(old).forEach(k => { if (!FLAGS[k]) FLAGS[k] = { st: "resolved", t: +old[k] || Date.now() }; });
    localStorage.setItem("flag_state", JSON.stringify(FLAGS));
    localStorage.removeItem("radar_ack");
  }
} catch (e) {}
let flagMsg = null;        // { key, text, ok } — one-line result shown under the item just acted on
const taskCache = {};      // eventId -> [task rows] (full list, lazy-loaded when the panel opens)
const foldOpen = {};       // fold-out id -> open (so acting on one item doesn't snap the list shut)
const fold = (id, label, inner, defOpen) => {
  const open = id in foldOpen ? foldOpen[id] : !!defOpen;
  return `<details class="sub" data-fold="${id}"${open ? " open" : ""}><summary>${label}</summary>${inner}</details>`;
};

function stOf(c) {
  const f = FLAGS[c.key];
  if (!f || !f.st || f.st === "open") return "open";
  if (f.st === "snoozed" && !(f.until > Date.now())) return "open";   // snooze ran out
  return f.st;
}
const isAcked = c => { const s = stOf(c); return s === "resolved" || s === "snoozed"; };   // out of view
const isProg = c => stOf(c) === "progress";
const isOpenC = c => stOf(c) === "open";
const openCatches = () => RADAR.catches.filter(c => !isAcked(c));
const catchesFor = id => RADAR.catches.filter(c => c.showId === id);
const flagEditing = () => !!document.querySelector(".fa textarea");

function persistFlags() {
  try { localStorage.setItem("flag_state", JSON.stringify(FLAGS)); } catch (e) {}
}
function setFlag(key, st, extra) {
  const prev = FLAGS[key] || {};
  const e = Object.assign({}, extra || {}, { st, t: Math.max(Date.now(), (prev.t || 0) + 1) });   // always newer than what it replaces
  if (prev.notes && !e.notes) e.notes = prev.notes;          // notes survive a change of state
  FLAGS[key] = e;
  // forget choices about catches that stopped existing a month ago (keeps the store small)
  const live = new Set(RADAR.catches.map(c => c.key));
  if (RADAR.t && !RADAR.loading) Object.keys(FLAGS).forEach(k => { if (!live.has(k) && Date.now() - (FLAGS[k].t || 0) > 30 * 86400000) delete FLAGS[k]; });
  persistFlags();
  pushFlags({ [key]: e });
}
// Take anything newer from the other device. Returns true if something changed here.
function adoptFlags(remote) {
  let changed = false;
  Object.keys(remote || {}).forEach(k => {
    const r = remote[k];
    if (r && r.t && (!FLAGS[k] || r.t > (FLAGS[k].t || 0))) { FLAGS[k] = r; changed = true; }
  });
  if (changed) persistFlags();
  return changed;
}
async function pushFlags(items) {
  try {
    const r = await fetch(`${WORKER}/flags?key=${encodeURIComponent(pin())}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ items }) });
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.items && adoptFlags(d.items) && !flagEditing()) refreshRadarViews();
  } catch (e) {}   // offline or route missing: the choice still holds on this device
}
async function loadFlags() {
  try {
    const r = await fetch(`${WORKER}/flags?key=${encodeURIComponent(pin())}`);
    if (!r.ok) return;
    const d = await r.json();
    const remote = (d && d.items) || {};
    adoptFlags(remote);
    const mine = {};
    Object.keys(FLAGS).forEach(k => { if (!remote[k] || (FLAGS[k].t || 0) > (remote[k].t || 0)) mine[k] = FLAGS[k]; });
    if (Object.keys(mine).length) pushFlags(mine);
  } catch (e) {}
}

// A note on an in-progress item is also appended to the show's PM Notes in Airtable (Iq's own tap).
// The current value is re-read first so nobody else's edit is overwritten.
async function appendPmNote(c, text) {
  const s = SHOWS.find(x => x.id === c.showId);
  if (!s) return false;
  const recs = await api(EVENTS_TBL, { filterByFormula: `RECORD_ID()='${s.id}'`, "fields[]": ["PM Notes"] });
  const cur = recs[0] ? String(recs[0].fields["PM Notes"] || "") : String(s.pmNotes || "");
  const next = (cur.trim() ? cur.replace(/\s+$/, "") + "\n" : "") + `${fmtD(today0())} · ${c.title}: ${text}`;
  await api(EVENTS_TBL, {}, "PATCH", s.id, { fields: { "PM Notes": next } });
  s.pmNotes = next;
  const ev = RAW && RAW.events.find(e => e.id === s.id);
  if (ev) ev.fields["PM Notes"] = next;
  try { localStorage.setItem("dash_cache", JSON.stringify({ t: lastLoad, ...RAW })); } catch (e) {}
  return true;
}
// Mark in progress (or add another note). The dashboard keeps the note either way; Airtable is best effort and says so.
async function markProgress(key, text) {
  const c = RADAR.catches.find(x => x.key === key);
  if (!c) return;
  const notes = ((FLAGS[key] && FLAGS[key].notes) || []).slice();
  let note = null;
  if (text) { note = { t: Date.now(), text }; notes.push(note); }
  setFlag(key, "progress", { notes });
  clOpen[key] = 1;
  flagMsg = null;
  refreshRadarViews();
  if (!note || !c.showId) return;
  try {
    await appendPmNote(c, text);
    note.at = 1;
    flagMsg = { key, ok: true, text: "Note saved here and to PM notes in Airtable." };
  } catch (e) {
    note.at = 0;
    flagMsg = { key, ok: false, text: "Note saved here. Airtable didn't take it: " + e.message };
  }
  setFlag(key, "progress", { notes });
  if (!flagEditing()) { refreshRadarViews(); if (selectedId === c.showId && !notesEditing()) { const v = document.getElementById("notesView"); const s = SHOWS.find(x => x.id === c.showId); if (v && s && s.pmNotes) v.innerHTML = esc(s.pmNotes); } }
}
async function retryNote(key, t) {
  const c = RADAR.catches.find(x => x.key === key), f = FLAGS[key];
  const note = f && (f.notes || []).find(n => String(n.t) === String(t));
  if (!c || !note) return;
  try { await appendPmNote(c, note.text); note.at = 1; flagMsg = { key, ok: true, text: "Note is now in PM notes in Airtable." }; }
  catch (e) { flagMsg = { key, ok: false, text: "Airtable still didn't take it: " + e.message }; }
  setFlag(key, f.st, { notes: f.notes, until: f.until });
  refreshRadarViews();
}
function saveRadarCache() {
  try {
    localStorage.setItem("dash_radar", JSON.stringify({ t: RADAR.t, extra: RADAR.extra, tasks: RADAR.tasks, xpos: RADAR.xpos, analyst: RADAR.analyst }));
  } catch (e) {}
}

function taskRow(r, eid) {
  const f = r.fields;
  return {
    id: r.id,
    eid: eid || first(f["id (from Events)"]) || "",
    name: String(first(f["Name"]) || "Untitled").trim(),
    due: f["Due Date"] || "",
    ds: f["Due Status"] === "Past Due" ? "P" : (f["Due Status"] ? "W" : ""),
    status: f["Task Status"] || "Not Started",
    cat: first(f["Catagory (from Task Templates)"]) || "",
    order: +first(f["Display Order (from Task Templates)"]) || 0
  };
}
const taskIsOpen = r => r.status !== "Done" && r.status !== "Not Needed";

// ── Load: four independent reads; any one failing leaves the rest working ──
async function loadRadar(events, positions) {
  RADAR.loading = true;
  const errs = [];
  const t = today0();
  const ids = events.map(e => e.id);
  const guard = (label, p) => p.catch(e => { if (!(e && e.auth)) errs.push(label); });
  const jobs = [];

  if (ids.length) {
    jobs.push(guard("RentalWorks sync fields", api(EVENTS_TBL, {
      filterByFormula: "OR(" + ids.map(id => `RECORD_ID()='${id}'`).join(",") + ")",
      "fields[]": RADAR_EVENT_FIELDS
    }).then(recs => { const m = {}; recs.forEach(r => { m[r.id] = r.fields; }); RADAR.extra = m; })));

    const evOr = "OR(" + ids.map(id => `FIND('${id}',ARRAYJOIN({id (from Events)}))`).join(",") + ")";
    jobs.push(guard("tasks", api(TASKS_TBL, {
      filterByFormula: `AND({Due Status}!='',{Task Status}!='Done',{Task Status}!='Not Needed',FIND('${ME}',{Assignee}&''),${evOr})`,
      "fields[]": TASK_META_FIELDS, pageSize: 100
    }).then(recs => { RADAR.tasks = recs.map(r => taskRow(r)); })));

    // Everyone on my still-running shows → every other booking they hold, from today on.
    const liveIds = new Set(events.filter(e => { const d = parseDate(e.fields["Timeline End"]); return !d || d >= t; }).map(e => e.id));
    const names = [...new Set(positions
      .filter(p => [].concat(p.fields["id (from Event)"] || []).some(id => liveIds.has(id)))
      .filter(p => first(p.fields["Short Name (from Roles)"]) !== "Staff")
      .map(p => first(p.fields["Name (from Crew)"])).filter(Boolean))];
    if (names.length) {
      jobs.push(guard("cross-show bookings", api(POS_TBL, {
        filterByFormula: `AND(IS_AFTER({Timeline End},DATEADD(TODAY(),-1,'days')),OR(${names.map(n => `{Name (from Crew)}='${fq(n)}'`).join(",")}))`,
        "fields[]": XPOS_FIELDS, pageSize: 100
      }).then(recs => {
        const seen = new Set();
        RADAR.xpos = recs.map(r => {
          const f = r.fields;
          return { name: first(f["Name (from Crew)"]) || "", status: String(f["Status"] || "").trim(),
            a: f["Timeline Start"] || "", b: f["Timeline End"] || "",
            ev: String(first(f["Name (from Event)"]) || "").trim(), type: first(f["Event Type (from Event)"]) || "", eid: first(f["id (from Event)"]) || "" };
        }).filter(x => { const k = [x.name, x.eid, x.a, x.b, x.status].join("|"); if (seen.has(k)) return false; seen.add(k); return x.a && x.b; });
      })));
    } else RADAR.xpos = [];
  }

  // Analyst catches (judgement calls a scheduled Claude run writes to worker KV). Optional layer — silent if absent.
  jobs.push(fetch(`${WORKER}/radar?key=${encodeURIComponent(pin())}`)
    .then(r => r.ok ? r.json() : null)
    .then(d => { if (d && Array.isArray(d.items)) RADAR.analyst = d.items; })
    .catch(() => {}));

  jobs.push(loadFlags());   // resolve / snooze / in-progress choices made on the other device

  await Promise.all(jobs);
  RADAR.loading = false; RADAR.errs = errs; RADAR.t = Date.now();
  saveRadarCache();
  computeRadar();
  refreshRadarViews();
}

// Radar data arrived or changed: repaint without disturbing whatever the user has open.
function refreshRadarViews() {
  renderList(); renderStats();
  if (flagEditing()) return;     // a note is being typed: leave the page alone until it's saved or cancelled
  if (selectedId === "radar") { renderDetail(); return; }
  const s = SHOWS.find(x => x.id === selectedId);
  if (s) refreshShowRadar(s);
}
function refreshShowRadar(s) {
  const st = document.getElementById("shStatus");
  if (st) st.innerHTML = showStatusHtml(s);
  const hero = document.getElementById("shHero");
  if (hero) { hero.innerHTML = showHeroesHtml(s); wireCatches(hero); }
  const wb = accBody("show.watch");
  if (wb) { wb.innerHTML = showWatchHtml(s); wireCatches(wb); accSum("show.watch", showWatchSum(s)); }
  const rb = accBody("show.ready");
  if (rb) { const pf = preflight(s); rb.innerHTML = pf.html; accSum("show.ready", pf.sum); }
  const ts = document.getElementById("tasksSum");
  if (ts) ts.innerHTML = tasksSummary(s);
}

// Everywhere I'm booked or blocked out, from EventPositions (falls back to this page's shows until that loads).
function myWhere() {
  const out = [];
  const mine = RADAR.xpos.filter(x => x.name.includes(ME) && !isRemoteMe(x.eid, x.name) && !/cancel/i.test(x.type) && !/^(empty|not confirmed)$/i.test(x.status));
  if (mine.length) {
    mine.forEach(x => {
      const A = parseDate(x.a), B = parseDate(x.b);
      if (!A || !B) return;
      const sh = SHOWS.find(s => s.id === x.eid);
      const away = /away/i.test(x.status);
      out.push({ A, B, away, tentative: /pencil/i.test(x.status), eid: x.eid,
        label: away ? "Away" : (sh ? (sh.city || shortTitle(sh.title)) : shortTitle(x.ev)) });
    });
  } else {
    SHOWS.forEach(s => s.crew.filter(c => c.name.includes(ME) && !c.remoteMe).forEach(c => c.stints.forEach(sn => {
      if (sn.a && sn.b) out.push({ A: sn.a, B: sn.b, away: false, tentative: false, eid: s.id, label: s.city || shortTitle(s.title) });
    })));
  }
  return out.sort((a, b) => a.A - b.A);
}

// ── The rule engine ──
// sev 3 = needs action · 2 = watch · 1 = FYI.  `key` is stable for a given fact, so an
// acknowledgement sticks until the underlying values change — then the catch comes back.
function computeRadar() {
  const out = [];
  const t = today0();
  const add = (s, o) => { o.showId = s ? s.id : null; o.show = s ? shortTitle(s.title) : ""; out.push(o); };
  const xp = RADAR.xpos.filter(x => !isRemoteMe(x.eid, x.name)).map(x => Object.assign({}, x, { A: parseDate(x.a), B: parseDate(x.b) })).filter(x => x.A && x.B);
  const away = myWhere().filter(w => w.away && w.B >= t);

  SHOWS.forEach(s => {
    if (isArchived(s)) return;
    const st = stateOf(s);
    const hasX = !!RADAR.extra[s.id];
    const x = RADAR.extra[s.id] || {};
    const myTasks = RADAR.tasks.filter(k => k.eid === s.id);

    if (st === "done") {
      if (myTasks.length) add(s, { key: `wrap|${s.id}|${myTasks.length}`, sev: 1, cat: "Tasks",
        title: `Wrap-up: ${myTasks.length} task${myTasks.length === 1 ? "" : "s"} still open`,
        detail: `Show wrapped ${agoTxt(s.tlEnd)}. Close them out or mark them Not Needed.`, src: "Airtable · Tasks", when: null });
      return;
    }

    const dl = deadlineOf(s);
    const D = dl.d ? daysFromToday(dl.d) : null;
    const within = n => st === "live" || (D !== null && D <= n);
    const confirmed = s.crew.filter(c => /confirm/i.test(c.status) && !/not conf/i.test(c.status));

    // 1 · Booth ship is the real deadline
    if (dl.ship && st !== "live" && D !== null && D <= URGENT_DAYS) {
      const li = s.dates["Load In"];
      add(s, { key: `ship|${s.id}|${+dl.d}`, sev: D <= 2 ? 3 : 2, cat: "Dates",
        title: `Booth ships ${D === 0 ? "today" : D === 1 ? "tomorrow" : "in " + D + " days"} (${fmtD(dl.d)})`,
        detail: li ? `${dd(li, dl.d)} day${dd(li, dl.d) === 1 ? "" : "s"} ahead of load-in. Anything not on the truck ships late.` : "",
        src: "Airtable · Events · Booth Ship Date", when: dl.d });
    }

    // 2 · Airtable vs RentalWorks dates
    [["LoadIn Check", "Load In", "RWSynced LoadInDate", "Load-in"],
     ["LoadOut Check", "Load Out", "RWSynced LoadOutDate", "Load-out"],
     ["ShipDate Check", "Booth Ship", "RWSynced ShipDate", "Ship"]].forEach(([chk, dk, rwk, label]) => {
      if (!/mismatch/i.test(String(x[chk] || ""))) return;
      const at = s.dates[dk], rw = parseDate(x[rwk]);
      if (!at || !rw || sameDay(at, rw)) return;
      const early = at < rw ? at : rw, late = at < rw ? rw : at;
      if (late < t) return;                                   // both in the past — moot
      const gap = dd(late, early);
      add(s, { key: `rw|${s.id}|${chk}|${+at}|${+rw}`, sev: daysFromToday(early) <= 7 ? 3 : 2, cat: "Dates",
        title: `${label}: Airtable says ${fmtD(at)}, RentalWorks says ${fmtD(rw)}`,
        detail: `${gap} day${gap === 1 ? "" : "s"} apart. Confirm which one the truck and crew are working to.`,
        src: `Airtable · Events · ${chk}`, when: early });
    });

    // 3 · Crew not locked
    if (!s.crew.length) {
      if (within(30)) add(s, { key: `nocrew|${s.id}`, sev: within(URGENT_DAYS) ? 3 : 2, cat: "Crew",
        title: "No crew assigned", detail: countdownTxt(s) + ".", src: "Airtable · EventPositions", when: dl.d });
    } else {
      const pen = s.crew.filter(c => /pencil/i.test(c.status));
      const nc = s.crew.filter(c => /not conf/i.test(c.status));
      const emp = s.crew.filter(c => /^empty$/i.test(c.status));
      const parts = [];
      if (pen.length) parts.push(`${pen.length} pencilled`);
      if (nc.length) parts.push(`${nc.length} not confirmed`);
      if (emp.length) parts.push(`${emp.length} marked Empty`);
      if (parts.length) add(s, { key: `crewstat|${s.id}|${pen.length}|${nc.length}|${emp.length}`,
        sev: within(URGENT_DAYS) ? 3 : within(30) ? 2 : 1, cat: "Crew",
        title: cap(parts.join(" · ")),
        detail: listNames(pen.concat(nc, emp).map(c => nick(c.raw))) + ". " + cap(countdownTxt(s)) + ".",
        src: "Airtable · EventPositions · Status", when: dl.d });
    }

    // 4 · Crew booked somewhere else at the same time (people sharing the same clash become one catch)
    const clash = new Map();
    s.crew.forEach(c => {
      if (c.staff || c.remoteMe || /^(empty|away)$/i.test(c.status)) return;
      const others = xp.filter(o => o.name === c.raw && o.eid !== s.id && !/cancel/i.test(o.type) && !/^empty$/i.test(o.status));
      c.stints.forEach(sn => {
        if (!sn.a || !sn.b || sn.b < t) return;
        others.forEach(o => {
          const lo = sn.a > o.A ? sn.a : o.A, hi = sn.b < o.B ? sn.b : o.B;
          const od = dd(hi, lo) + 1;
          if (od < 1) return;
          const sib = SHOWS.find(z => z.id === o.eid);
          if (sib && !isArchived(sib) && stateOf(sib) !== "done") {
            // both shows are mine: report once, on the later-starting side (where it bites)
            if (o.A > sn.a || (sameDay(o.A, sn.a) && o.eid < s.id)) return;
          }
          const oAway = /away/i.test(o.status);
          const tentative = !(oAway || /^confirmed$/i.test(o.status)) || !/confirm/i.test(c.status) || /not conf/i.test(c.status);
          const turnaround = od === 1 && (sameDay(o.B, sn.a) || sameDay(o.A, sn.b));
          const gk = [turnaround ? "t" : "o", o.eid || "solo:" + c.raw, o.a, o.b, o.status, +lo, +hi, tentative ? 1 : 0].join("|");
          let g = clash.get(gk);
          if (!g) { g = { o, lo, hi, od, oAway, tentative, turnaround, before: sameDay(o.B, sn.a), raws: [] }; clash.set(gk, g); }
          if (!g.raws.includes(c.raw)) g.raws.push(c.raw);
        });
      });
    });
    clash.forEach(g => {
      const o = g.o, names = g.raws.map(nick);
      const who = cap(listNames(names));
      const isAre = names.length > 1 || names[0] === "You" ? "are" : "is";
      const oName = g.oAway && !o.ev ? "time off" : g.oAway ? o.ev : shortTitle(o.ev);
      const dStart = daysFromToday(g.lo);
      const key = `x|${s.id}|${g.raws.slice().sort().join("+")}|${o.eid || "away"}|${o.a}|${o.b}|${o.status}`;
      const src = "Airtable · EventPositions across shows";
      if (g.turnaround) {
        add(s, { key, sev: dStart <= 14 ? 2 : 1, cat: "Crew",
          title: `${who}: same-day turnaround on ${fmtD(g.lo)}`,
          detail: g.oAway
            ? (g.before ? `Away ${fmtRange(o.A, o.B)} ends the day this stint starts.` : `Away ${fmtRange(o.A, o.B)} starts the day this stint ends.`)
            : (g.before ? `Off ${oName} (${fmtRange(o.A, o.B)}) the same day this stint starts.` : `On to ${oName} (${fmtRange(o.A, o.B)}) the same day this stint ends.`),
          src, when: g.lo });
      } else {
        add(s, { key, sev: g.tentative ? (dStart <= 30 ? 2 : 1) : (dStart <= 21 ? 3 : 2), cat: "Crew",
          title: g.oAway ? `${who} ${isAre} away ${fmtRange(g.lo, g.hi)}, during this show`
                         : `${who} ${isAre} double-booked ${fmtRange(g.lo, g.hi)}`,
          detail: g.oAway ? `Blocked out ${fmtRange(o.A, o.B)}${o.ev ? " (" + o.ev + ")" : ""}. ${g.od} day${g.od === 1 ? "" : "s"} overlap this stint.`
                          : `${o.status || "Unconfirmed"} on ${oName}, ${fmtRange(o.A, o.B)}. ${g.od} day${g.od === 1 ? "" : "s"} overlap.`,
          src, when: g.lo });
      }
    });

    // 5 · Milestones that land while I'm away
    away.forEach(a => {
      const hits = [];
      const firstD = [s.dates["Travel In"], s.dates["Load In"]].filter(Boolean).sort((p, q) => p - q)[0];
      if (s.tlStart && firstD && s.tlStart < firstD && s.tlStart >= a.A && s.tlStart <= a.B && s.tlStart >= t) hits.push(["prep start", s.tlStart]);
      [["Booth Ship", "ship"], ["Travel In", "crew travel-in"], ["Load In", "load-in"], ["Show Start", "show open"], ["Load Out", "load-out"]].forEach(([k, l]) => {
        const d = s.dates[k];
        if (d && d >= a.A && d <= a.B && d >= t) hits.push([l, d]);
      });
      if (!hits.length) return;
      const otherPm = s.crew.find(c => c.role === "PM" && !c.name.includes(ME) && /confirm/i.test(c.status));
      add(s, { key: `away|${s.id}|${+a.A}|${+a.B}|${hits.map(h => h[0]).join(",")}`, sev: otherPm ? 2 : 3, cat: "Coverage",
        title: `${cap(listNames(hits.map(h => h[0])))} land${hits.length === 1 ? "s" : ""} while you're away`,
        detail: `You're out ${fmtRange(a.A, a.B)}. ` + hits.map(h => `${cap(h[0])} ${fmtD(h[1])}`).join(" · ") + ". " +
          (otherPm ? `${nick(otherPm.raw)} is PM on this one.` : "No other PM is on the crew list."),
        src: "Airtable · EventPositions (Away) + Events dates", when: hits[0][1] });
    });

    // 6 · Travel not recorded
    if (hasX && x["Event Type"] === "Travelling Labor" && st !== "live") {
      const tin = s.dates["Travel In"] || s.tlStart;
      const dT = tin ? daysFromToday(tin) : null;
      if (dT !== null && dT <= 14) {
        const travellers = confirmed.filter(c => !c.staff && !c.remoteMe);
        const missing = travellers.filter(c => !c.travelInfo);
        if (missing.length) add(s, { key: `travel|${s.id}|${missing.map(c => c.raw).join(",")}`, sev: dT <= URGENT_DAYS ? 3 : 2, cat: "Travel",
          title: `No flight or hotel note for ${listNames(missing.map(c => nick(c.raw)))}`,
          detail: `Crew starts ${fmtD(tin)} (${dueTxt(tin)}). ${travellers.length - missing.length} of ${travellers.length} have a booking note.`,
          src: "Airtable · EventPositions · Flight/Hotel Info", when: tin });
      }
      const noPrep = s.crew.filter(c => /no prep booked/i.test(c.travelInfo));
      if (noPrep.length && dT !== null && dT <= 21) add(s, { key: `noprep|${s.id}|${noPrep.map(c => c.raw).join(",")}`, sev: 2, cat: "Travel",
        title: `Booking notes read "NO prep booked" for ${listNames(noPrep.map(c => nick(c.raw)))}`,
        detail: `Their stints start ${fmtD(noPrep[0].stints[0] && noPrep[0].stints[0].a)}. Confirm prep lodging is covered or not needed.`,
        src: "Airtable · EventPositions · Flight/Hotel Info", when: tin });
    }

    // 6b · Remote oversight: the dashboard treats me as remote, Airtable still has me on the crew
    const rm = s.crew.find(c => c.remoteMe);
    if (rm) add(s, { key: `remoteme|${s.id}|${rm.status}`, sev: 1, cat: "Record",
      title: "Airtable still lists you on the crew",
      detail: `You're overseeing this one remotely, but your ${rm.role || "crew"} position (${rm.stints.map(x => fmtRange(x.a, x.b)).join(", ") || "no dates"}, ${rm.status || "no status"}) is still in EventPositions. Ask whoever manages crew to remove it.`,
      src: "Dashboard remote-oversight list vs Airtable · EventPositions", when: null });

    // 7 · Record hygiene that turns into real problems
    if (s.status && !/confirm/i.test(s.status) && confirmed.length) add(s, { key: `status|${s.id}|${s.status}|${confirmed.length}`,
      sev: within(45) ? 2 : 1, cat: "Record",
      title: `Still ${s.status} with ${confirmed.length} crew confirmed`,
      detail: "People are committed against a show that isn't confirmed in Airtable.", src: "Airtable · Events · Status", when: dl.d });
    if (!s.booth && st !== "live") add(s, { key: `booth|${s.id}`, sev: within(14) ? 2 : 1, cat: "Record",
      title: "No booth number on the record", detail: "Labels, the InfoDoc and the freight paperwork all key off it.", src: "Airtable · Events · Booth Number", when: null });
    if (s.dates["Show Start"] && s.dates["Load In"] && sameDay(s.dates["Show Start"], s.dates["Load In"])) add(s, {
      key: `samestart|${s.id}|${+s.dates["Load In"]}`, sev: within(30) ? 2 : 1, cat: "Dates",
      title: `Show Start and Load-in are both ${fmtD(s.dates["Load In"])}`,
      detail: "One of them is probably wrong in the Event Schedule.", src: "Airtable · Event Schedule", when: s.dates["Load In"] });
    if (hasX && x["Drawing Needed"] && !/^done$/i.test(String(x["Drawing Status"] || ""))) add(s, {
      key: `drawing|${s.id}|${x["Drawing Status"] || ""}`, sev: within(21) ? 2 : 1, cat: "Drawings",
      title: `Drawing ${String(x["Drawing Status"] || "not started").toLowerCase()}`,
      detail: cap(countdownTxt(s)) + "." + (x["loadCalcsNeeded"] ? " Load calcs are also required." : ""),
      src: "Airtable · Events · Drawing Status", when: dl.d });
    if (hasX && !x["Infodoc Email Sent"] && st !== "live") {
      const tin = s.dates["Travel In"] || s.tlStart;
      if (tin && daysFromToday(tin) <= 10) add(s, { key: `infodoc|${s.id}`, sev: daysFromToday(tin) <= URGENT_DAYS ? 3 : 2, cat: "Comms",
        title: "InfoDoc email not sent", detail: `Crew travels ${fmtD(tin)} (${dueTxt(tin)}).`, src: "Airtable · Events · Infodoc Email Sent", when: tin });
    }
    if (st !== "live" && D !== null && D <= 21 && s.mailTotal >= 3) {
      const last = s.mailMeta[0] && s.mailMeta[0].date;
      const quiet = last ? -daysFromToday(last) : null;
      if (quiet !== null && quiet > 10) add(s, { key: `quiet|${s.id}|${+last}`, sev: 1, cat: "Comms",
        title: `No logged email in ${quiet} days`,
        detail: "Only threads that include the integrations address reach Airtable, so this can be a capture gap rather than silence.",
        src: "Airtable · Zapier Emails", when: null });
    }

    // 8 · Tasks
    const past = myTasks.filter(k => k.ds === "P"), week = myTasks.filter(k => k.ds === "W");
    if (past.length || week.length) {
      const allConf = s.crew.length && s.crew.every(c => c.staff || (/confirm/i.test(c.status) && !/not conf/i.test(c.status)));
      const allTravel = s.crew.length && s.crew.filter(c => !c.staff).every(c => c.travelInfo);
      const hints = myTasks.filter(k => (/traveling crew/i.test(k.name) && allConf) || (/travel is booked/i.test(k.name) && allTravel));
      const bits = [];
      if (past.length) bits.push(`${past.length} past due`);
      if (week.length) bits.push(`${week.length} due this week`);
      const oldest = past.slice().sort((a, b) => (parseDate(a.due) || 0) - (parseDate(b.due) || 0))[0];
      add(s, { key: `tasks|${s.id}|${past.length}|${week.length}`, sev: past.length && within(14) ? 2 : 1, cat: "Tasks",
        title: `Tasks: ${bits.join(" · ")}`,
        detail: (hints.length ? `${hints.length} look${hints.length === 1 ? "s" : ""} done already (${hints.map(h => `"${h.name}"`).join(", ")}): the crew records agree. ` : "") +
          (oldest ? `Oldest: "${oldest.name}", due ${fmtD(parseDate(oldest.due))}.` : ""),
        src: "Airtable · Tasks assigned to you", when: null });
    }

    // 9 · What was said on a call vs what Airtable says (from the Granola sync)
    (s.meetings || []).forEach(m => (m.dateFlags || []).forEach(fl => {
      const txt = String(fl.text || "");
      const mm = txt.match(/^Call \(([^)]+)\):\s*([\s\S]*?\.)\s+([\s\S]*)$/);
      add(s, { key: `call|${s.id}|${m.id || m.title}|${txt.slice(0, 48)}`, sev: 2, cat: "Calls",
        title: mm ? `On the ${mm[1]} call: ${mm[2].replace(/\.$/, "")}` : txt.slice(0, 110),
        detail: mm ? mm[3] : "", src: `Granola · ${m.title}${m.date ? " · " + fmtD(parseDate(m.date)) : ""}`, when: null });
    }));
  });

  // 10 · Analyst catches
  (RADAR.analyst || []).forEach(a => {
    if (!a || !a.title) return;
    const exp = a.expires ? parseDate(a.expires) : null;
    if (exp && exp < t) return;
    const s = a.showId ? SHOWS.find(z => z.id === a.showId) : null;
    if (a.showId && (!s || isArchived(s) || stateOf(s) === "done")) return;
    const o = { key: `an|${a.id || a.title}`, sev: Math.max(1, Math.min(3, +a.sev || 2)), cat: "Analyst",
      title: String(a.title), detail: String(a.detail || ""), src: String(a.src || "Claude scan"), when: a.when ? parseDate(a.when) : null };
    o.showId = s ? s.id : null; o.show = s ? shortTitle(s.title) : "";
    out.push(o);
  });

  out.sort((a, b) => (b.sev - a.sev) || ((a.when ? +a.when : 9e15) - (b.when ? +b.when : 9e15)));
  RADAR.catches = out;
  return out;
}

// ── Catch rendering ──
// Two shapes: a "hero" for the few things that need a decision, and a one-line row for
// everything else that opens to the why, the source and the actions.
const clOpen = {};         // catch key -> expanded this session
const HERO_MAX = 5;
const SNOOZES = [[1, "1 day"], [7, "1 week"], [30, "1 month"]];
const dayStamp = t => fmtD(new Date(t));

// What can be done with a catch, by where it stands. Every button carries data-act; one listener per .fa handles them.
function actionsHtml(c, extra) {
  const st = stOf(c);
  const b = (act, label, cls) => `<button class="btn${cls ? " " + cls : ""}" data-act="${act}">${label}</button>`;
  const btns = st === "open" ? b("resolve", "Resolve") + b("snooze", "Snooze") + b("progress", "In progress")
    : st === "progress" ? b("resolve", "Resolve") + b("snooze", "Snooze") + b("note", "Add note") + b("reopen", "Not in progress", "ghost")
    : st === "snoozed" ? b("reopen", "Wake now") + b("resolve", "Resolve")
    : b("reopen", "Reopen");
  const m = flagMsg && flagMsg.key === c.key ? `<span class="fa-m ${flagMsg.ok ? "good" : "hot"}">${esc(flagMsg.text)}</span>` : "";
  return `<span class="fa" data-key="${esc(c.key)}">${btns}${extra || ""}${m}</span>`;
}
function notesHtml(c) {
  const f = FLAGS[c.key], notes = (f && f.notes) || [];
  if (!notes.length) return "";
  return `<div class="nts">` + notes.map(n =>
    `<div class="nt"><b>${esc(dayStamp(n.t))}</b><span>${esc(n.text)}</span>${n.at === 0 ? `<button class="btn ghost" data-act="retry" data-arg="${n.t}">Not in Airtable · retry</button>` : ""}</div>`).join("") + `</div>`;
}
function heroHtml(c, withShow) {
  const kick = [withShow && c.show ? esc(c.show) : "", esc(c.cat)].filter(Boolean).join(" · ");
  return `<article class="hero">
    <div class="hero-k">${kick}${c.when ? ` <i>· ${esc(dueTxt(c.when))}</i>` : ""}</div>
    <h3>${esc(c.title)}</h3>
    ${c.detail ? `<p>${esc(c.detail)}</p>` : ""}
    <div class="hero-a">
      ${withShow && c.showId ? `<button class="btn pri" data-go="${c.showId}">Open show</button>` : ""}
      ${actionsHtml(c)}
    </div>
    ${c.src ? `<div class="src hero-s">${esc(c.src)}</div>` : ""}
  </article>`;
}
function heroesHtml(arr, withShow, foldId) {
  if (!arr.length) return "";
  const head = arr.slice(0, HERO_MAX), rest = arr.slice(HERO_MAX);
  return `<div class="heroes">${head.map(c => heroHtml(c, withShow)).join("")}</div>` +
    (rest.length ? fold(foldId, `${rest.length} more that need${rest.length === 1 ? "s" : ""} you`, `<div class="heroes" style="margin-top:0">${rest.map(c => heroHtml(c, withShow)).join("")}</div>`, false) : "");
}
function catchLine(c, withShow) {
  const st = stOf(c), f = FLAGS[c.key] || {}, o = !!clOpen[c.key];
  const notes = f.notes || [], last = notes[notes.length - 1];
  const right = st === "progress" ? "since " + dayStamp(notes.length ? notes[0].t : f.t)
    : st === "snoozed" ? "back " + dayStamp(f.until)
    : st === "resolved" ? "resolved " + dayStamp(f.t)
    : c.when ? dueTxt(c.when) : "";
  return `<div class="cl s${c.sev}${st === "open" ? "" : " " + st}${st === "resolved" || st === "snoozed" ? " acked" : ""}${o ? " open" : ""}" data-cl="${esc(c.key)}">
    <button class="cl-h" aria-expanded="${o}"><span class="pip"></span><span class="cl-t">${withShow && c.show ? `<b>${esc(c.show)}</b>` : ""}${esc(c.title)}${st === "progress" && last ? `<span class="cl-n">${esc(last.text)}</span>` : ""}</span>${right ? `<span class="cl-d">${esc(right)}</span>` : ""}</button>
    <div class="cl-b"${o ? "" : " hidden"}>
      ${c.detail ? `<p>${esc(c.detail)}</p>` : ""}
      ${notesHtml(c)}
      ${c.src ? `<div class="src">${esc(c.cat)} · ${esc(c.src)}</div>` : ""}
      <div class="cl-a">
        ${actionsHtml(c, withShow && c.showId ? `<button class="btn ghost" data-go="${c.showId}">Open show</button>` : "")}
      </div>
    </div>
  </div>`;
}
// Catches grouped under their show (shows in date order; anything without a show last).
function groupedLines(arr) {
  if (!arr.length) return "";
  const order = SHOWS.map(s => s.id);
  const groups = new Map();
  arr.forEach(c => { const k = c.showId || ""; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); });
  const rank = k => { const i = order.indexOf(k); return i < 0 ? 1e6 : i; };
  return [...groups.keys()].sort((a, b) => rank(a) - rank(b)).map(k => {
    const cs = groups.get(k);
    const head = k ? `<button class="grp-h" data-go="${k}" title="Open show">${esc(cs[0].show)} <span>${cs.length}</span></button>`
                   : `<div class="grp-h" style="cursor:default">General <span>${cs.length}</span></div>`;
    return head + cs.map(c => catchLine(c, false)).join("");
  }).join("");
}

// One tap for Resolve; Snooze and In progress open in place (no pop-up to chase on a phone).
function flagAct(fa, act, arg) {
  const key = fa.dataset.key;
  const done = () => { flagMsg = null; refreshRadarViews(); };
  if (act === "resolve") { delete clOpen[key]; setFlag(key, "resolved"); return done(); }
  if (act === "reopen") { setFlag(key, "open"); return done(); }
  if (act === "snz") {
    const d = today0(); d.setDate(d.getDate() + (+arg || 1));
    delete clOpen[key]; setFlag(key, "snoozed", { until: +d }); return done();
  }
  if (act === "cancel") return done();
  if (act === "retry") { retryNote(key, arg); return; }
  if (act === "snooze") {
    fa.classList.add("wide");
    fa.innerHTML = `<span class="fa-l">Snooze for</span>` + SNOOZES.map(([n, l]) => `<button class="btn" data-act="snz" data-arg="${n}">${l}</button>`).join("") + `<button class="btn ghost" data-act="cancel">Cancel</button>`;
    return;
  }
  if (act === "progress" || act === "note") {
    const c = RADAR.catches.find(x => x.key === key);
    fa.classList.add("wide");
    fa.innerHTML = `<textarea rows="2" placeholder="${act === "note" ? "Add a note" : "What's happening? (optional)"}" aria-label="Note"></textarea>
      <button class="btn pri" data-act="save">${act === "note" ? "Add note" : "Mark in progress"}</button><button class="btn ghost" data-act="cancel">Cancel</button>
      <span class="fa-h">${c && c.showId ? "The note stays on this item and is added to the show's PM notes in Airtable." : "The note stays on this item."}</span>`;
    const ta = fa.querySelector("textarea");
    ta.focus();
    ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); flagAct(fa, "save"); } if (e.key === "Escape") flagAct(fa, "cancel"); });
    return;
  }
  if (act === "save") {
    const ta = fa.querySelector("textarea");
    const text = ta ? ta.value.trim() : "";
    if (ta) ta.remove();                    // so the repaint guard no longer sees an open editor
    markProgress(key, text);
  }
}
function wireCatches(root) {
  if (!root) return;
  root.querySelectorAll("details[data-fold]").forEach(d => d.addEventListener("toggle", () => { foldOpen[d.dataset.fold] = d.open; }));
  root.querySelectorAll(".cl-h").forEach(h => h.addEventListener("click", () => {
    const row = h.parentElement, o = !row.classList.contains("open");
    row.classList.toggle("open", o); h.setAttribute("aria-expanded", String(o));
    row.querySelector(".cl-b").hidden = !o;
    if (o) clOpen[row.dataset.cl] = 1; else delete clOpen[row.dataset.cl];
  }));
  root.querySelectorAll(".fa").forEach(fa => fa.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    e.stopPropagation();
    flagAct(fa, b.dataset.act, b.dataset.arg);
  }));
  root.querySelectorAll("[data-go]").forEach(el => {
    const go = () => selectShow(el.dataset.go);
    el.addEventListener("click", e => { e.stopPropagation(); go(); });
    if (el.tagName !== "BUTTON") el.addEventListener("keydown", e => { if (e.target === el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); go(); } });
  });
}

// Readiness: the standing facts about a show, as chips. Returns the chips and a one-line count.
function preflight(s) {
  const x = RADAR.extra[s.id];
  const chips = [];
  let ok = 0, open = 0;
  const chip = (label, val, cls) => {
    if (cls === "ok") ok++; else if (cls === "warn" || cls === "bad") open++;
    chips.push(`<span class="pfc ${cls || ""}">${label}<b>${esc(val)}</b></span>`);
  };
  const real = s.crew.filter(c => !/^(empty|away)$/i.test(c.status));
  const conf = real.filter(c => /confirm/i.test(c.status) && !/not conf/i.test(c.status)).length;
  chip("Crew", s.crew.length ? `${conf}/${s.crew.length} confirmed` : "none", !s.crew.length ? "bad" : conf === s.crew.length ? "ok" : "warn");
  const trav = s.crew.filter(c => !c.staff && !c.remoteMe && !/^(empty|away)$/i.test(c.status));
  if (trav.length && (!x || x["Event Type"] === "Travelling Labor")) {
    const noted = trav.filter(c => c.travelInfo).length;
    chip("Travel notes", `${noted}/${trav.length}`, noted === trav.length ? "ok" : "warn");
  }
  chip("Booth", s.booth ? "#" + s.booth : "missing", s.booth ? "ok" : "warn");
  if (x) {
    const mm = ["LoadIn Check", "LoadOut Check", "ShipDate Check"].filter(k => /mismatch/i.test(String(x[k] || ""))).length;
    chip("RentalWorks", (x["RWSynced Status"] ? String(x["RWSynced Status"]).toLowerCase() + " · " : "") + (mm ? `${mm} date mismatch${mm === 1 ? "" : "es"}` : "dates match"), mm ? "warn" : "ok");
    chip("InfoDoc", x["Infodoc Email Sent"] ? "sent" : "not sent", x["Infodoc Email Sent"] ? "ok" : "");
    if (x["Drawing Needed"]) chip("Drawing", String(x["Drawing Status"] || "not started").toLowerCase(), /^done$/i.test(String(x["Drawing Status"] || "")) ? "ok" : "warn");
    if (x["loadCalcsNeeded"]) chip("Load calcs", "required", "");
    if (x["Rigging Needed"]) chip("Rigging", "required", "");
  }
  chip("AV binder", s.links["AV Binder"] ? "linked" : "no link", s.links["AV Binder"] ? "ok" : "");
  return {
    html: `<div class="pf">${chips.join("")}</div>`,
    sum: open ? `<span class="warm">${open} open</span> · ${ok} ready` : `${ok} ready`
  };
}

// ── Run of show: to-scale strip of every active show plus where I am ──
function timelineHtml() {
  const t = today0();
  const shows = SHOWS.filter(s => !isArchived(s) && stateOf(s) !== "done" && s.tlStart && s.tlEnd);
  if (!shows.length) return `<div class="none">No active shows.</div>`;
  const start = new Date(t); start.setDate(start.getDate() - ((start.getDay() + 6) % 7));   // Monday of this week
  const maxEnd = shows.reduce((m, s) => s.tlEnd > m ? s.tlEnd : m, t);
  const weeks = Math.min(14, Math.max(6, Math.ceil((dd(maxEnd, start) + 1) / 7)));
  const span = weeks * 7;
  const lim = v => Math.max(0, Math.min(100, v));
  const seg = (a, b) => {
    const l = lim(dd(a, start) / span * 100), r = lim((dd(b, start) + 1) / span * 100);
    return r > l ? `left:${l.toFixed(3)}%;width:${(r - l).toFixed(3)}%` : null;
  };
  const mid = d => ((dd(d, start) + 0.5) / span * 100);
  const grid = `background-size:${(100 / weeks).toFixed(4)}% 100%`;
  const nowLine = `<div class="now" style="left:${mid(t).toFixed(3)}%" title="Today"></div>`;

  let axis = "";
  for (let w = 0; w < weeks; w++) {
    const d = new Date(start); d.setDate(d.getDate() + w * 7);
    axis += `<span style="left:${(w / weeks * 100).toFixed(4)}%">${fmtD(d)}</span>`;
  }

  const meBars = myWhere().filter(w => w.B >= start).map(w => {
    const st = seg(w.A, w.B);
    if (!st) return "";
    const cls = w.away ? "away" : ("you" + (w.tentative ? " tent" : ""));
    const go = !w.away && SHOWS.find(s => s.id === w.eid) ? ` data-go="${w.eid}"` : "";
    return `<div class="bar ${cls}" style="${st}"${go} title="${esc(w.label)} · ${esc(fmtRange(w.A, w.B))}"><span class="bl">${esc(w.label)}</span></div>`;
  }).join("");

  const rows = shows.map(s => {
    const st = seg(s.tlStart, s.tlEnd);
    let core = "";
    const a = s.dates["Show Start"], b = s.dates["Show End"];
    if (st && a && b && b >= a) {
      const total = dd(s.tlEnd, s.tlStart) + 1;
      const l = lim(dd(a, s.tlStart) / total * 100), r = lim((dd(b, s.tlStart) + 1) / total * 100);
      if (r > l) core = `<span class="core" style="left:${l.toFixed(2)}%;width:${(r - l).toFixed(2)}%"></span>`;
    }
    const ship = s.dates["Booth Ship"];
    const tick = ship && ship >= start && dd(ship, start) < span ? `<div class="tick" style="left:${mid(ship).toFixed(3)}%" title="Ships ${esc(fmtD(ship))}"></div>` : "";
    const bar = st ? `<div class="bar ${s.travel ? "travel" : "remote"}" style="${st}" data-go="${s.id}" title="${esc(s.title)} · ${esc(fmtRange(s.tlStart, s.tlEnd))}">${core}</div>` : "";
    return `<div class="lab" data-go="${s.id}" title="${esc(s.title)}">${esc(shortTitle(s.title))}</div><div class="trk" style="${grid}">${bar}${tick}${nowLine}</div>`;
  }).join("");

  return `<div class="tl">
    <div class="lab"></div><div class="ax">${axis}</div>
    <div class="lab me">You</div><div class="trk me" style="${grid}">${meBars}${nowLine}</div>
    ${rows}
  </div>`;
}

// ── Agenda: every milestone across every show, next N days ──
function agendaItems(days) {
  const t = today0();
  const end = new Date(t); end.setDate(end.getDate() + days - 1);
  const items = [];
  const push = (d, kind, label, s, extra) => {
    if (d && d >= t && d <= end) items.push({ d, kind, label, id: s ? s.id : null, show: s ? shortTitle(s.title) : "", extra: extra || "" });
  };
  SHOWS.forEach(s => {
    if (isArchived(s) || stateOf(s) === "done") return;
    const D = s.dates;
    const firstD = [D["Travel In"], D["Load In"]].filter(Boolean).sort((a, b) => a - b)[0];
    if (s.tlStart && firstD && s.tlStart < firstD) push(s.tlStart, "in", "Prep starts", s);
    push(D["Booth Ship"], "ship", "Ships", s);
    push(D["Travel In"], "in", "Travel in", s);
    push(D["Load In"], "in", "Load-in", s);
    push(D["Show Start"], "show", "Show opens", s);
    push(D["Show End"], "show", "Show closes", s);
    push(D["Load Out"], "out", "Load-out", s);
    push(D["Travel Out"], "out", "Travel out", s);
  });
  myWhere().forEach(w => {
    if (w.away) { push(w.A, "me", "You", null, "Away through " + fmtD(w.B)); if (!sameDay(w.A, w.B)) push(w.B, "me", "You", null, "Last day away"); }
    else { const s = SHOWS.find(z => z.id === w.eid); push(w.A, "me", "You join", s || null, s ? "" : w.label); }
  });
  const order = { me: 0, ship: 1, in: 2, show: 3, out: 4 };
  items.sort((a, b) => (a.d - b.d) || (order[a.kind] - order[b.kind]));
  return items;
}
function agendaHtml(days) {
  const items = agendaItems(days);
  if (!items.length) return `<div class="none">Nothing scheduled in the next ${days} days.</div>`;
  const t = today0();
  const byDay = [];
  items.forEach(it => {
    let g = byDay[byDay.length - 1];
    if (!g || !sameDay(g.d, it.d)) { g = { d: it.d, rows: [] }; byDay.push(g); }
    // same show, same day → one line ("Show closes · Load-out")
    const prev = it.id && g.rows.find(r => r.id === it.id && r.kind !== "me" && it.kind !== "me");
    if (prev) prev.label += " · " + it.label; else g.rows.push(Object.assign({}, it));
  });
  return `<div class="ag">` + byDay.map(g => {
    const n = daysFromToday(g.d);
    const wd = n === 0 ? "Today" : n === 1 ? "Tomorrow" : g.d.toLocaleDateString("en-US", { weekday: "short" });
    return `<div class="dy${n === 0 ? " today" : ""}"><b>${wd}</b>${fmtD(g.d)}</div><div class="its">` +
      g.rows.map(r => `<div class="agi ${r.kind}"${r.id ? ` data-go="${r.id}" tabindex="0" role="button"` : ""}><span class="nm">${esc(r.show || r.extra)}</span><span class="k">${esc(r.label)}</span></div>`).join("") +
      `</div>`;
  }).join("") + `</div>`;
}

function nextUp() {
  const it = agendaItems(45)[0];
  if (!it) return "";
  const when = dueTxt(it.d);
  if (it.kind === "me") {
    if (it.show) return `you join ${it.show} ${when}`;
    if (/^Away/.test(it.extra)) return `you're a${it.extra.slice(1)}, starting ${when}`;
    if (/^Last day/.test(it.extra)) return `your last day away is ${when}`;
    return `${it.extra} ${when}`;
  }
  const verb = { "Travel in": "crew travel in", "Travel out": "crew travel out" }[it.label] || it.label.toLowerCase();
  return `${it.show} ${verb} ${when}`;
}

function tasksSummary(s) {

async function loadTasks(s, force) {
  if (!force && taskCache[s.id]) return taskCache[s.id];
  const recs = await api(TASKS_TBL, {
    filterByFormula: `AND(FIND('${s.id}',ARRAYJOIN({id (from Events)})),FIND('${ME}',{Assignee}&''))`,
    "fields[]": TASK_FULL_FIELDS, pageSize: 100

function renderTasks(s) {

  const rank = c => { const i = TASK_CAT_ORDER.indexOf(c); return i < 0 ? 9 : i; };
  const cats = [...new Set(rows.map(r => r.cat))].sort((a, b) => rank(a) - rank(b));

      (taskIsOpen(b) - taskIsOpen(a)) || ((+parseDate(a.due) || 9e15) - (+parseDate(b.due) || 9e15)) || (a.order - b.order) || a.name.localeCompare(b.name));
    const op = rs.filter(taskIsOpen), cl = rs.filter(r => !taskIsOpen(r));
    return `<div class="tkcat"><span>${esc(TASK_CATS[cat] || "Other")}</span><span class="n">${op.length} open</span>${op.length ? `<button class="tkall" data-cat="${esc(cat)}" data-n="${op.length}">Mark all done</button>` : ""}</div>` +
      op.map(taskHtml).join("") +
      (cl.length ? fold("tk-" + s.id + "-" + cat, `${cl.length} closed`, cl.map(taskHtml).join(""), false) : "");
  }).join("") + `<div class="tkfoot" id="tkMsg">Tap a circle to set a status. Changes save straight to Airtable.</div>`;
  body.querySelectorAll("details[data-fold]").forEach(d => d.addEventListener("toggle", () => { foldOpen[d.dataset.fold] = d.open; }));
}
function taskMsg(txt, ok) {
  const m = document.getElementById("tkMsg");
  if (m) { m.textContent = txt; m.className = "tkfoot " + (ok ? "ok" : "err"); }
}

// keep the Radar's due-task list in step with a change made here
function syncRadarTask(r) {
  RADAR.tasks = RADAR.tasks.filter(k => k.id !== r.id);
  if (r.ds && taskIsOpen(r)) RADAR.tasks.push({ id: r.id, eid: r.eid, name: r.name, due: r.due, ds: r.ds, status: r.status, cat: r.cat, order: r.order });
}
function afterTaskChange(s) {
  computeRadar(); saveRadarCache();
  renderList(); renderStats(); refreshShowRadar(s);
}

async function setTaskStatus(s, id, status) {
  const r = (taskCache[s.id] || []).find(x => x.id === id);
  if (!r || r.status === status) { renderTasks(s); return; }
  const prev = r.status;
  r.status = status; syncRadarTask(r); renderTasks(s); afterTaskChange(s);
  taskMsg("Saving…", true);
  try {
    await api(TASKS_TBL, {}, "PATCH", id, { fields: { "Task Status": status } });
    taskMsg(`Saved to Airtable: "${r.name}" is ${status}.`, true);
  } catch (e) {
    r.status = prev; syncRadarTask(r); renderTasks(s); afterTaskChange(s);
    taskMsg("Couldn't save, nothing changed: " + e.message, false);
  }
}

async function markAllDone(s, cat) {
  const rows = (taskCache[s.id] || []).filter(r => r.cat === cat && taskIsOpen(r));
  if (!rows.length) return;
  rows.forEach(r => { r.status = "Done"; syncRadarTask(r); });
  renderTasks(s); afterTaskChange(s);
  taskMsg(`Saving ${rows.length}…`, true);
  try {
    for (let i = 0; i < rows.length; i += 10) {   // Airtable takes 10 records per write
      await api(TASKS_TBL, {}, "PATCH", null, { records: rows.slice(i, i + 10).map(r => ({ id: r.id, fields: { "Task Status": "Done" } })) });
    }
    taskMsg(`Saved to Airtable: ${rows.length} task${rows.length === 1 ? "" : "s"} marked Done.`, true);
  } catch (e) {
    // some batches may have landed — reload the truth rather than guess
    delete taskCache[s.id];
    try { await loadTasks(s, true); (taskCache[s.id] || []).forEach(syncRadarTask); } catch (e2) {}
    renderTasks(s); afterTaskChange(s);
    taskMsg("Couldn't save everything, list reloaded from Airtable: " + e.message, false);
  }
}

// The task list loads the first time its row is opened.
async function openTasks(s) {
  const body = document.getElementById("tasksBody");
  if (!body) return;
  renderTasks(s);
  if (taskCache[s.id]) return;
  try { await loadTasks(s, false); }
  catch (e) { if (selectedId === s.id) body.innerHTML = `<div class="none hot">Couldn't load tasks: ${esc(e.message)}</div>`; return; }
  if (selectedId !== s.id) return;
  renderTasks(s);
  const ts = document.getElementById("tasksSum"); if (ts) ts.innerHTML = tasksSummary(s);
}

function setupTasks(s) {
  const body = document.getElementById("tasksBody");
  if (!body) return;
  body.addEventListener("click", ev => {
    const all = ev.target.closest(".tkall");
    if (all) {
      if (all.dataset.armed !== "1") {     // two taps: arm, then confirm
        all.dataset.armed = "1"; all.classList.add("armed");
        all.textContent = `Tap again: mark ${all.dataset.n} done`;
        clearTimeout(all._t);
        all._t = setTimeout(() => { all.dataset.armed = ""; all.classList.remove("armed"); all.textContent = "Mark all done"; }, 4000);
        return;
      }
      clearTimeout(all._t);
      markAllDone(s, all.dataset.cat);
      return;
    }
    const pick = ev.target.closest(".tkmenu button");
    if (pick) { setTaskStatus(s, pick.closest(".tk").dataset.tid, pick.dataset.st); return; }
    const dot = ev.target.closest(".tkb");
    if (dot) {
      const rowEl = dot.closest(".tk");
      const had = rowEl.querySelector(".tkmenu");
      body.querySelectorAll(".tkmenu").forEach(m => m.remove());
      body.querySelectorAll(".tkb").forEach(b => b.setAttribute("aria-expanded", "false"));
      if (had) return;
      const r = (taskCache[s.id] || []).find(x => x.id === rowEl.dataset.tid);
      const menu = document.createElement("div");
      menu.className = "tkmenu";
      menu.innerHTML = TASK_STATUSES.map(v => `<button data-st="${v}" class="${r && r.status === v ? "on" : ""}">${v}</button>`).join("");
      rowEl.appendChild(menu);
      dot.setAttribute("aria-expanded", "true");
    }
  });
}

// FILES — view + upload (worker /upload → KV → Airtable)
// ════════════════════════════════════════════════
async function loadFiles(s, force) {
  const el = document.getElementById("filesList");
  if (!el) return;
  try {
    const c = filesCache[s.id];
    if (force || !c || Date.now() - c.t > 15 * 60 * 1000) {
      filesCache[s.id] = {
        t: Date.now(),
        recs: await api(FILES_TBL, {
          filterByFormula: `FIND('${s.id}',ARRAYJOIN({id (from Events)}))`,
          "fields[]": FILE_FIELDS,
          "sort[0][field]": "Created",
          "sort[0][direction]": "desc"
        })
      };
    }
    const recs = filesCache[s.id].recs;
    const fsum = document.getElementById("filesSum");
    if (fsum) fsum.textContent = recs.length ? recs.length + (recs.length === 1 ? " file" : " files") : "none yet";
    if (!recs.length) { el.innerHTML = '<div class="pad" style="color:var(--dim)">No files yet. Upload drawings, photos, or docs.</div>'; return; }
    el.innerHTML = recs.map(r => {
      const f = r.fields;
      const atts = f["File"] || [];
      const by = f["Created By"] && f["Created By"].name ? f["Created By"].name : "";
      const when = f["Created"] ? fmtD(parseDate(f["Created"])) : "";
      const links = atts.map(a => {
        const img = a.thumbnails && a.thumbnails.large && String(a.type || "").startsWith("image/");
        return `<a href="${esc(a.url)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:12.5px;margin:0 8px 6px 0">
          ${img ? `<img src="${esc(a.thumbnails.small.url)}" alt="" style="height:24px;border-radius:3px">` : ic("file")}
          ${esc(a.filename || "file")} <span style="color:var(--dim)">${a.size ? Math.round(a.size / 1024) + " KB" : ""}</span>
        </a>`;
      }).join("") || '<span style="color:var(--dim)">(no attachment)</span>';
      return `<div style="padding:9px 0;border-bottom:1px solid var(--line)">
        <div style="display:flex;gap:10px;align-items:baseline;margin-bottom:5px">
          <b>${esc(f["Name"] || "Untitled")}</b>
          ${f["Notes"] ? `<span style="color:var(--dim);font-size:12px">${esc(f["Notes"])}</span>` : ""}
          <span class="mono" style="margin-left:auto;color:var(--dim);font-size:11.5px">${esc(by)}${by && when ? " · " : ""}${when}</span>
          <button class="fdel" data-del="${r.id}" title="Remove file" aria-label="Remove ${esc(f["Name"] || "Untitled")}" style="border:none;background:none;color:var(--dim);cursor:pointer;font-size:13px;padding:0 4px;line-height:1;margin-left:6px">✕</button>
        </div>
        <div style="display:flex;flex-wrap:wrap">${links}</div>
      </div>`;
    }).join("");
  } catch (e) {
    el.innerHTML = `<div class="pad" style="color:var(--red)">Couldn't load files: ${esc(e.message)}</div>`;
  }
}

function setupFiles(s) {
  loadFiles(s, false);
  const _fl = document.getElementById("filesList");
  if (_fl && !_fl.dataset.delWired) {
    _fl.dataset.delWired = "1";
    _fl.addEventListener("click", async (ev) => {
      const b = ev.target.closest(".fdel");
      if (!b) return;
      ev.preventDefault();
      if (b.dataset.armed !== "1") {
        b.dataset.armed = "1";
        b.dataset.orig = b.textContent;
        b.textContent = "Remove?";
        b.style.color = "var(--red)";
        b.style.fontWeight = "700";
        clearTimeout(b._t);
        b._t = setTimeout(() => {
          b.dataset.armed = "";
          b.textContent = b.dataset.orig || "\u2715";
          b.style.color = "var(--dim)";
          b.style.fontWeight = "";
        }, 4000);
        return;
      }
      clearTimeout(b._t);
      b.disabled = true;
      b.textContent = "\u2026";
      const recId = b.dataset.del;
      try {
        const res = await fetch(`${WORKER}/delete-file?id=${encodeURIComponent(recId)}&key=${encodeURIComponent(pin())}`, { method: "POST" });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.error) throw new Error(data.error || ("HTTP " + res.status));
        const c = filesCache[s.id];
        if (c) c.recs = c.recs.filter(r => r.id !== recId);
        loadFiles(s, false);
      } catch (e) {
        b.disabled = false;
        b.textContent = "\u2715";
        b.style.color = "var(--dim)";
        b.style.fontWeight = "";
        b.dataset.armed = "";
        const msg = document.getElementById("fileMsg");
        if (msg) { msg.textContent = "Delete failed: " + e.message; setTimeout(() => { msg.textContent = ""; }, 5000); }
      }
    });
  }
  const input = document.getElementById("fileInput");
  const btn = document.getElementById("uploadBtn");
  const msg = document.getElementById("fileMsg");
  btn.addEventListener("click", () => input.click());
  input.addEventListener("change", async () => {
    const files = [...input.files];
    if (!files.length) return;
    btn.disabled = true;
    let ok = 0;
    for (let i = 0; i < files.length; i++) {
      msg.textContent = `Uploading ${i + 1}/${files.length}…`;
      try {
        const fd = new FormData();
        fd.append("file", files[i]);
        const res = await fetch(`${WORKER}/upload?eventId=${s.id}&key=${encodeURIComponent(pin())}`, { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || "HTTP " + res.status);
        ok++;
      } catch (e) {
        msg.textContent = `Failed: ${files[i].name} — ${e.message}`;
      }
    }
    if (ok) {
      msg.textContent = `✓ ${ok} uploaded`;
      setTimeout(() => { msg.textContent = ""; }, 4000);
      setTimeout(() => loadFiles(s, true), 2500);   // give Airtable a moment to ingest from KV
      setTimeout(() => loadFiles(s, true), 12000);  // attachments finish processing
    }
    btn.disabled = false;
    input.value = "";
  });
}

// CALENDAR EXPORT (.ics)
// ════════════════════════════════════════════════
function downloadIcs(s) {
  const pad = n => String(n).padStart(2, "0");
  const dstr = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  const stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const short = s.title.split("@")[0].trim();
  let ics = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//ShowOps//EN\r\n";
  Object.entries(s.dates).filter(([, d]) => d).forEach(([k, d], i) => {
    const end = new Date(d); end.setDate(end.getDate() + 1);
    ics += "BEGIN:VEVENT\r\n" +
      `UID:${s.id}-${i}@showops\r\n` +
      `DTSTAMP:${stamp}\r\n` +
      `DTSTART;VALUE=DATE:${dstr(d)}\r\n` +
      `DTEND;VALUE=DATE:${dstr(end)}\r\n` +
      `SUMMARY:${short} — ${k}\r\n` +
      `LOCATION:${(s.venue + (s.cityState ? ", " + s.cityState : "")).replace(/[,;]/g, "\\$&")}\r\n` +
      "END:VEVENT\r\n";
  });
  ics += "END:VCALENDAR\r\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  a.download = short.replace(/[^\w]+/g, "-") + ".ics";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ════════════════════════════════════════════════
// WEATHER — open-meteo, free, no key; cached 3h
// ════════════════════════════════════════════════
const WMO = c =>
  c === 0 ? "☀" : c <= 2 ? "🌤" : c === 3 ? "☁" : c <= 48 ? "🌫" :
  c <= 57 ? "🌦" : c <= 67 ? "🌧" : c <= 77 ? "🌨" : c <= 82 ? "🌧" : c <= 86 ? "🌨" : "⛈";

async function loadWeather(s) {
  const el = document.getElementById("wx");
  if (!el || !s.city) return;
  const from = s.dates["Travel In"] || s.dates["Load In"] || s.tlStart;
  const end = s.tlEnd || from;
  if (!from || daysFromToday(from) > 14 || (end && end < today0())) return;

  try {
    const geoKey = "wx_geo_" + s.city.toLowerCase();
    let geo = JSON.parse(localStorage.getItem(geoKey) || "null");
    if (!geo) {
      const g = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(s.city)}&count=1&language=en&format=json`).then(r => r.json());
      if (!g.results || !g.results[0]) return;
      geo = { la: g.results[0].latitude, lo: g.results[0].longitude };
      localStorage.setItem(geoKey, JSON.stringify(geo));
    }
    const fcKey = "wx_fc_" + geo.la.toFixed(2) + "_" + geo.lo.toFixed(2);
    let fc = JSON.parse(localStorage.getItem(fcKey) || "null");
    if (!fc || Date.now() - fc.t > 3 * 3600 * 1000) {
      const data = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geo.la}&longitude=${geo.lo}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=16`).then(r => r.json());
      if (!data.daily) return;
      fc = { t: Date.now(), d: data.daily };
      localStorage.setItem(fcKey, JSON.stringify(fc));
    }
    const t = today0();
    const cells = [];
    fc.d.time.forEach((ds, i) => {
      const d = parseDate(ds);
      if (!d || d < t || (from && d < new Date(from.getTime() - 86400000)) && d < t) return;
      if (from && d > new Date(Math.min((end || from).getTime(), t.getTime() + 15 * 86400000))) return;
      if (d < from && daysFromToday(from) > 2) return;   // only lead-in days when show is close
      if (cells.length >= 8) return;
      const pr = fc.d.precipitation_probability_max[i];
      cells.push(`<div class="w"><b>${d.toLocaleDateString("en-US", { weekday: "short", day: "numeric" })}</b> ${WMO(fc.d.weather_code[i])} ${Math.round(fc.d.temperature_2m_max[i])}°/${Math.round(fc.d.temperature_2m_min[i])}°${pr >= 30 ? ` <span style="color:var(--accent)">${pr}%</span>` : ""}</div>`);
    });
    if (cells.length) el.innerHTML = `<div class="w" style="border:none;background:none;padding-left:0">${esc(s.city)}:</div>` + cells.join("");
  } catch (e) { /* weather is decorative — fail silent */ }
}

// EMAIL BODIES — lazy load per show, cached
// ════════════════════════════════════════════════
function replyAllHref(f, subj) {
  const all = extractEmails(String(f["From"] || "") + "," + String(f["To"] || "") + "," + String(f["CC"] || ""))
    .filter(a => !MY_EMAILS.includes(a));
  if (!all.length) return null;
  const to = extractEmails(f["From"])[0] || all[0];
  const cc = all.filter(a => a !== to);
  const sub = /^re:/i.test(subj) ? subj : "Re: " + subj;
  return `mailto:${to}?cc=${encodeURIComponent(cc.join(","))}&subject=${encodeURIComponent(sub)}`;
}

async function toggleMail(s, mailEl) {
  if (mailEl.classList.contains("open")) { mailEl.classList.remove("open"); return; }
  mailEl.classList.add("open");
  const bodyEl = mailEl.querySelector(".body");
  if (bodyEl.dataset.loaded) return;

  bodyEl.textContent = "Loading…";
  try {
    if (!mailCache[s.id]) {
      const formula = s.quote
        ? `FIND('${s.quote}',ARRAYJOIN({Related Event})&' '&{Subject})`
        : `FIND('${s.title.replace(/'/g, "\\'")}',ARRAYJOIN({Related Event})&' '&{Subject})`;
      mailCache[s.id] = await api(MAIL_TBL, {
        filterByFormula: formula,
        "fields[]": MAIL_FULL_FIELDS,
        "sort[0][field]": "Received Date",
        "sort[0][direction]": "desc",
        pageSize: 100
      });
    }
    const rec = mailCache[s.id].find(r => r.id === mailEl.dataset.mail);
    if (rec) {
      const f = rec.fields;
      let hdr = "To: " + (f["To"] || "—");
      if (f["CC"]) {
        const ccAddrs = extractEmails(f["CC"]);
        hdr += "  ·  CC: " + (ccAddrs.length ? ccAddrs.join(", ") : String(f["CC"]).slice(0, 120));
      }
      mailEl.querySelector(".to").textContent = hdr;
      bodyEl.textContent = cleanBody(f["Body"]) || "(empty body)";

      const bar = document.createElement("div");
      bar.style.cssText = "padding-top:10px;display:flex;gap:8px;flex-wrap:wrap";
      const reply = replyAllHref(f, f["Subject"] || s.title);
      if (reply) {
        const rb = document.createElement("a");
        rb.href = reply;
        rb.textContent = "↩ Reply All";
        rb.style.cssText = "border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-size:12.5px;font-weight:600";
        bar.appendChild(rb);
      }
      (f["Attachments"] || []).forEach(a => {
        const link = document.createElement("a");
        link.href = a.url; link.target = "_blank"; link.rel = "noopener";
        link.textContent = (a.filename || "attachment") + (a.size ? " (" + Math.round(a.size / 1024) + " KB)" : "");
        link.style.cssText = "border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-size:12px";
        bar.appendChild(link);
      });
      if (bar.children.length) bodyEl.appendChild(bar);
    } else {
      bodyEl.textContent = "(couldn't find this email)";
    }
    bodyEl.dataset.loaded = "1";
  } catch (e) {
    bodyEl.textContent = "Failed to load: " + e.message;
  }
}

// ════════════════════════════════════════════════
// PIN GATE + BOOT
// ════════════════════════════════════════════════
function showGate(errMsg) {
  document.getElementById("pinGate").style.display = "flex";
  document.getElementById("app").style.display = "none";
  document.getElementById("pinErr").textContent = errMsg || "";
  setTimeout(() => document.getElementById("pinInput").focus(), 50);
}
function hideGate() {
  document.getElementById("pinGate").style.display = "none";
  document.getElementById("app").style.display = "flex";
}

async function tryPin() {
  const v = document.getElementById("pinInput").value.trim();
  if (!v) return;
  const btn = document.getElementById("pinBtn");
  btn.textContent = "Checking…"; btn.disabled = true;
  try {
    const res = await fetch(`${WORKER}/v0/${BASE}/${EVENTS_TBL}?maxRecords=1&fields%5B%5D=Name&key=${encodeURIComponent(v)}`);
    if (res.status === 401) {
      localStorage.removeItem("dash_pin");
      document.getElementById("pinErr").textContent = "Wrong PIN — try again.";
      document.getElementById("pinInput").value = "";
    } else if (!res.ok) {
      document.getElementById("pinErr").textContent = "Connection problem (" + res.status + ").";
    } else {
      localStorage.setItem("dash_pin", v);
      hideGate();
      loadAll();
    }
  } catch (e) {
    document.getElementById("pinErr").textContent = "Network error — check connection.";
  } finally {
    btn.textContent = "Unlock"; btn.disabled = false;
  }
}

document.getElementById("pinBtn").addEventListener("click", tryPin);
document.getElementById("pinInput").addEventListener("keydown", e => { if (e.key === "Enter") tryPin(); });
document.getElementById("refreshBtn").addEventListener("click", loadAll);
document.getElementById("backBtn").addEventListener("click", () => selectShow("radar"));
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && lastLoad && Date.now() - lastLoad > 10 * 60 * 1000) loadAll();
});

(function boot() {
  if (!pin()) { showGate(); return; }
  hideGate();
  // instant open from cache, then refresh live
  try {
    const nc = JSON.parse(localStorage.getItem("dash_notes") || "null");
    if (nc && nc.shows) NOTES = nc;
  } catch (e) {}
  try {
    const rc = JSON.parse(localStorage.getItem("dash_radar") || "null");
    if (rc && rc.t) Object.assign(RADAR, { t: rc.t, extra: rc.extra || {}, tasks: rc.tasks || [], xpos: rc.xpos || [], analyst: rc.analyst || [] });
  } catch (e) {}
  try {
    const c = JSON.parse(localStorage.getItem("dash_cache") || "null");
    if (c && c.events) applyData(c.events, c.positions || [], c.mails || [], true);
  } catch (e) {}
  loadAll();
})();
</script>
